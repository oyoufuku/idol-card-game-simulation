hemeTags:["疲労回復","Appeal低下"],base:4,A:"自身が受ける疲労値の増加量を1減らす（最低0）。",Bcond:"パフォーマンス終了時、自身の疲労値が2以上。",B:"次のパフォーマンス中、対面のAppealを-4する。",C:null,skill:"endo"},{id:3,no:"No.03",name:"小田倉麗奈",attr:"キュート",group:"櫻坂46",generation:"3期生",tags:["3期生","櫻坂46","対クール","対単一属性"],themeTags:["対クール","対単一属性"],base:2,A:"相手ステージのクール人数と同じ値だけ、対面のAppealをマイナスする。",Bcond:"パフォーマンス終了時、相手ステージに存在する属性の種類数が2以下。",B:"次のパフォーマンス中、相手メンバー全員をクールとしても扱う。",C:null,skill:"odakura"},{id:4,no:"No.04",name:"小島凪紗",attr:"ユーモア",group:"櫻坂46",generation:"3期生",tags:["3期生","櫻坂46","疲労回復","フォーメーション固定"],themeTags:["疲労回復","フォーメーション固定"],base:3,A:"自身がBACKSにいる間、相手側または楽曲由来の数値的なAppeal減少が味方FRONTまたはCENTERに適用される場合、その減少量を1軽減する。スキル無効化・属性変更・疲労ペナルティは対象外。",Bcond:"BACKSで累計2パフォーマンスを終了する。",B:"味方1人を選び、自身とそのメンバーの疲労値を入れ替える。",C:null,skill:"kojima"},{id:5,no:"No.05",name:"谷口愛季",attr:"キュート",group:"櫻坂46",generation:"3期生",tags:["3期生","櫻坂46","キュート","Appeal低下"],themeTags:["キュート","Appeal低下"],base:5,A:"自チームのFRONT-LとFRONT-Rがともにキュートなら、対面のAppealを-2する。",Bcond:"キュート楽曲でCENTERとしてパフォーマンス終了。",B:"次のパフォーマンス中、自チーム8人全員の属性をキュートのみに上書きする。元の属性および他の追加属性はその間失われ、効果終了後に元の属性状態へ戻る。PLAINが適用される場合はPLAINを優先する。",C:"両チームのキュートではないメンバーのAppealを-1する。自チームも対象。",skill:"taniguchi"},{id:6,no:"No.06",name:"中嶋優月",attr:"ユーモア",group:"櫻坂46",generation:"3期生",tags:["3期生","櫻坂46","バースト","ユーモア"],themeTags:["バースト","ユーモア"],base:3,A:"両チームで現在BURST中のメンバー数の合計だけ、自身のAppealをプラスする。",Bcond:"パフォーマンス終了時、自チームのステージにユーモアが3人以上。",B:"自分以外のユーモアの味方1人をランダムに強制BURSTさせる。対象のB効果も発動する。強制BURSTは通常BURST使用済み状態を消費せず、通常BURST使用済みのメンバーも対象にできる。",C:null,skill:"nakashima"},{id:7,no:"No.07",name:"的野美青",attr:"ユーモア",group:"櫻坂46",generation:"3期生",tags:["3期生","櫻坂46","対スキル","対センター"],themeTags:["対スキル","対センター"],base:5,A:"対面の相手メンバーのAUTOを無効にする。",Bcond:"相手メンバーがBURSTを開始したとき。",B:"相手メンバー1人を選び、次のパフォーマンス終了まで現在のポジションに固定する。",C:"相手CENTERのCENTER SKILLを無効にし、自身の疲労値を+2する。",skill:"matono"},{id:8,no:"No.08",name:"向井純葉",attr:"クール",group:"櫻坂46",generation:"3期生",tags:["3期生","櫻坂46","Appeal上昇","勝ちポイント"],themeTags:["Appeal上昇","勝ちポイント"],base:4,A:"ラウンド開始時点で自チームがポイントで勝っているなら、自身のAppealを+2する。",Bcond:"自チームが2パフォーマンス連続で勝利する。",B:"次のパフォーマンス中、自身のAppealを自チームの現在ポイント数だけプラスする（最大+3）。",C:null,skill:"mukai"},{id:9,no:"No.09",name:"村井優",attr:"ユーモア",group:"櫻坂46",generation:"3期生",tags:["3期生","櫻坂46","フォーメーション移動","Appeal上昇"],themeTags:["フォーメーション移動","Appeal上昇"],base:4,A:"そのラウンドに自身がBACKSからステージへ移動した場合、そのパフォーマンス中、自身は相手・楽曲由来のAppeal減少、疲労付与、ポジションボーナス無効、属性変更を受けない。通常の位置由来疲労増加と、既に発生している疲労ペナルティは残る。R1の初期配置は移動に数えない。",Bcond:"同一ラウンドに自チームの3人以上がBACKSからステージへ移動する。R1の初期配置は数えない。",B:"次のパフォーマンス中、自身のAUTOが発動する場合、その効果を味方ステージ5人全員に適用する。",C:"そのラウンドにBACKSからステージへ移動した味方メンバーのAppealを+1する。",skill:"murai"},{id:10,no:"No.10",name:"村山美羽",attr:"クール",group:"櫻坂46",generation:"3期生",tags:["3期生","櫻坂46","クール","単一属性"],themeTags:["クール","単一属性"],base:4,A:"自チームのステージにクールが3人以上なら、自身のAppealを+2する。",Bcond:"クール楽曲でBACKSとしてパフォーマンス終了。",B:"次のパフォーマンス中、自チームのクールメンバーのAppealを+1する。",C:null,skill:"murayama"},{id:11,no:"No.11",name:"山下瞳月",attr:"クール",group:"櫻坂46",generation:"3期生",tags:["3期生","櫻坂46","センター","クール"],themeTags:["センター","クール"],base:2,A:"クール楽曲で自身がCENTERなら、自身のAppealを+1する。",Bcond:"CENTERで累計2パフォーマンスを終了する。",B:"BURST中、自身のAppealを+2し、相手由来の効果を受けない。",C:"CENTERなら自身のAppealを+5する。このCENTER SKILLは楽曲によるCENTER SKILL無効化を受けない。",skill:"yamashita"},{id:12,no:"No.12",name:"松田里奈",attr:"ユーモア",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","バースト","Appeal上昇"],themeTags:["バースト","Appeal上昇"],base:3,A:"自チームの累計BURST回数（通常BURST・強制BURSTを含む）が5回以上なら、自身のAppealを+3する。",Bcond:"同じパフォーマンス終了処理内で、自身以外の味方2人以上がBURSTを開始する。",B:"次のパフォーマンス終了後、味方1人をランダムに選び、そのメンバーの通常BURST使用済み状態をリセットする。累計BURST回数は減らさない。",C:"BURST中の味方メンバーのAppealを+2する。",skill:"matsuda"},{id:13,no:"No.13",name:"井上梨名",attr:"ユーモア",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","疲労回復","総疲労値"],themeTags:["疲労回復","総疲労値"],base:3,A:"シンメの疲労値を-2する。自身がBACKSにいる場合は、シンメへの効果の代わりに味方CENTERの疲労値を-2する（最低0）。",Bcond:"パフォーマンス終了時、自チーム8人の総疲労値が15以上。",B:"自チーム8人全員の疲労値を-2する（最低0）。",C:null,skill:"inoue"},{id:14,no:"No.14",name:"遠藤光莉",attr:"クール",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","クール","楽曲"],themeTags:["クール","楽曲"],base:3,A:"シンメがクールなら、自身とシンメのAppealをそれぞれ+1する。",Bcond:"パフォーマンス終了時、CENTER・FRONT-L・FRONT-Rの3人全員がクール。",B:"次のパフォーマンスの楽曲を「ジャマイカビール」に変更する。",C:null,skill:"endo_hikari"},{id:15,no:"No.15",name:"大園玲",attr:"クール",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","対スキル","Appeal増減"],themeTags:["対スキル","Appeal増減"],base:4,A:"自身はスキルおよび楽曲によるAppealの増減を受けない。",Bcond:"R6終了時。",B:"BURST中は自身のAUTOを無効にし、自身が受けるスキルおよび楽曲によるAppeal増減量を2倍にする。",C:null,skill:"ozono"},{id:16,no:"No.16",name:"大沼昌保",attr:"ユーモア",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","疲労付与","バースト"],themeTags:["疲労付与","バースト"],base:3,A:"対面の疲労値を+2する。",Bcond:"パフォーマンス終了時、対面の疲労値が6以上。",B:"BURST中、自身のAppealを+5する。BURSTしたパフォーマンス終了後、自身の基礎Appealを永続的に-1する（最低0）。その後、自身の通常BURST使用済み状態をリセットする。続くBURST条件判定で条件を満たした場合は、同じ終了処理内で再び通常BURSTする。",C:null,skill:"onuma"},{id:17,no:"No.17",name:"幸坂茉里乃",attr:"キュート",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","フォーメーション固定","Appeal低下"],themeTags:["フォーメーション固定","Appeal低下"],base:2,A:"自身がBACKSにいる間、相手CENTERのAppealを-2する。",Bcond:"キュート楽曲でステージ5枠のいずれかに配置され、パフォーマンスを終了する。",B:"相手メンバー1人を選び、次のパフォーマンス終了までFRONT-Rに固定し、そのメンバーのAppealを-6する。",C:null,skill:"kousaka"},{id:18,no:"No.18",name:"武元唯衣",attr:"クール",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","クール","楽曲"],themeTags:["クール","楽曲"],base:3,A:"楽曲属性がクールなら、自身のAppealを+3する。",Bcond:"クール楽曲が2パフォーマンス連続で続く。",B:"次のパフォーマンスの楽曲属性をクールとして扱い、自身のAppealを+2する。",C:null,skill:"takemoto"},{id:19,no:"No.19",name:"田村保乃",attr:"キュート",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","対バースト","Appeal低下"],themeTags:["対バースト","Appeal低下"],base:4,A:"対面がBURST中なら、その対面のAppealを-4する。",Bcond:"相手メンバーがBACKSにいる状態でBURSTを開始したとき。",B:"同じパフォーマンス終了処理内でBACKSからBURSTした相手が複数いる場合も1回だけ発動し、その中からランダムに1人を選ぶ。選ばれた相手を次のパフォーマンス終了までCENTERに固定し、Bスキルを無効にする。元のCENTERメンバーはBACKSへ移動する。",C:"BURST中の相手メンバーのAppealを-2する。",skill:"tamura"},{id:20,no:"No.20",name:"藤吉夏鈴",attr:"クール",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","対スキル","Appeal上昇"],themeTags:["対スキル","Appeal上昇"],base:4,A:"対面の相手AUTOによるAppeal上昇値と同じ値だけ、自身のAppealも上昇する。",Bcond:"パフォーマンス終了時、そのパフォーマンス中に自身へ実適用されたAUTO・BURST・CENTER SKILL・楽曲によるAppeal上昇量の合計が4以上。位置ボーナス・基礎Appealは含めない。",B:"そのパフォーマンス中に自身へ実適用された自身のAUTOによるAppeal上昇分を、次のパフォーマンスにも引き継ぐ。",C:"自チームのクールメンバーは、相手AUTOによるAppeal減少を受けない。",skill:"fujiyoshi"},{id:21,no:"No.21",name:"増本綺良",attr:"ユーモア",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","ユーモア","疲労付与"],themeTags:["ユーモア","疲労付与"],base:3,A:"両チームのユーモアではないメンバーの疲労値を+1する。",Bcond:"パフォーマンス終了時、相手チーム8人の総疲労値が20以上。",B:"対面の疲労値を+8する。",C:null,skill:"masumoto"},{id:22,no:"No.22",name:"森田ひかる",attr:"キュート",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","多属性","Appeal低下"],themeTags:["多属性","Appeal低下"],base:5,A:"自チームのステージにクールとユーモアが1人以上ずついるなら、対面のAppealを-1する。",Bcond:"CENTER・FRONT-L・FRONT-Rの3枠にクール・キュート・ユーモアが1人ずつ揃ってパフォーマンス終了。",B:"次のパフォーマンス中、自身を本来のキュートに加えてクール・ユーモアとしても扱い、対面のAppealを-2する。",C:"相手CENTERのAppealを、自チームのステージに存在する属性種類数だけマイナスする。",skill:"morita"},{id:23,no:"No.23",name:"守屋麗奈",attr:"キュート",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","疲労付与","Appeal低下"],themeTags:["疲労付与","Appeal低下"],base:4,A:"対面の疲労値が3以上なら、その対面のAppealを-2する。",Bcond:"パフォーマンス終了時、そのパフォーマンス中に対面へ実適用された、位置ボーナス以外のAppeal減少量の合計が4以上。AUTO・BURST・CENTER SKILL・楽曲・疲労ペナルティを含み、Appeal増加とは相殺しない。",B:"そのパフォーマンス中に対面へ実適用された自身のAUTOによるAppeal減少分を、次のパフォーマンスにも引き継ぐ。",C:"疲労値が3以上の相手メンバーのAppealを-1する。",skill:"moriya"},{id:24,no:"No.24",name:"山崎天",attr:"クール",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","負けポイント","Appeal上昇"],themeTags:["負けポイント","Appeal上昇"],base:3,A:"ラウンド開始時点で自チームがポイントで負けている場合のみ、相手チームの現在ポイント数だけ自身のAppealをプラスする。",Bcond:"自チームが2パフォーマンス連続で敗北する。引き分けは連敗に含めず、連敗数をリセットする。",B:"自身の基礎Appealを永続的に+2する。複数回発動した場合は重複する。",C:"自身がCENTERで自チームが敗北したとき、その時点でステージにいる味方の疲労値を-1し、その味方は次のパフォーマンスのみAppeal+1。引き分けでは発動しない。",skill:"yamasaki"},{id:25,no:"No.25",name:"金村美玖",attr:"クール",group:"日向坂46",generation:"2期生",tags:["2期生","日向坂46","フォーメーション固定","Appeal上昇"],themeTags:["フォーメーション固定","Appeal上昇"],base:4,A:"前ラウンドと同じポジションでパフォーマンスする場合、そのポジションを連続で維持した回数だけ自身のAppealを+1する。R1は発動しない。",Bcond:"同一ポジションで累計3回以上パフォーマンスを終了したポジションがある。",B:"BURST中、自チームのポジションボーナスを2倍にする。",C:"前ラウンドと同じポジションにいる味方メンバーのAppealを+1する。R1は発動しない。",skill:"kanemura"},{id:26,no:"No.26",name:"小坂菜緒",attr:"クール",group:"日向坂46",generation:"2期生",tags:["2期生","日向坂46","センター","フォーメーション固定"],themeTags:["センター","フォーメーション固定"],base:5,A:"自身が受けるポジション由来のAppealボーナスとポジション由来の疲労増加を、各種加算・軽減を反映した後に2倍する。自身の疲労ペナルティによるAppeal減少量も2倍する。",Bcond:"CENTERかつ自身の疲労値が6以上でパフォーマンス終了。",B:"BURST中、自身のAppealを+3する。BURSTしたパフォーマンス終了後、自身の疲労値を+5する。",C:"自身の疲労値が0～2なら、自チームのポジションボーナスをそれぞれ+1する。",skill:"kosaka"},{id:27,no:"No.27",name:"髙橋未来虹",attr:"クール",group:"日向坂46",generation:"3期生",tags:["3期生","日向坂46","クール","単一属性"],themeTags:["クール","単一属性"],base:3,A:"自チームのステージにクールが3人以上なら、自身のAppealを+2する。",Bcond:"クール楽曲で、味方CENTERがクールの状態でパフォーマンス終了。",B:"自身の基礎Appealを永続的に+1する。",C:null,skill:"takahashi"},{id:28,no:"No.28",name:"小西夏菜実",attr:"クール",group:"日向坂46",generation:"4期生",tags:["4期生","日向坂46","クール","フォーメーション移動"],themeTags:["クール","フォーメーション移動"],base:4,A:"シンメがクールなら、自身とシンメのAppealをそれぞれ+1する。",Bcond:"自身が累計で異なる3人とシンメになってパフォーマンスを終了する。",B:"次のパフォーマンス中、自身とその時点のシンメのAppealをそれぞれ+2する。",C:null,skill:"konishi"},{id:29,no:"No.29",name:"正源司陽子",attr:"クール",group:"日向坂46",generation:"4期生",tags:["4期生","日向坂46","対疲労付与","Appeal上昇"],themeTags:["対疲労付与","Appeal上昇"],base:4,A:"自身が疲労ペナルティを受けているなら、自身のAppealを+2する。",Bcond:"自身が疲労ペナルティを3パフォーマンス連続で受ける。",B:"BURST中、自身のAppealを+3する。",C:"疲労ペナルティを受けている味方メンバーのAppealを+1する。",skill:"shogenji"},{id:30,no:"No.30",name:"平岡海月",attr:"クール",group:"日向坂46",generation:"4期生",tags:["4期生","日向坂46","楽曲","多属性"],themeTags:["楽曲","多属性"],base:3,A:"その試合で登場済みの楽曲属性の種類数だけ自身のAppealを+1する（最大+3）。",Bcond:"クール・キュート・ユーモアの3属性の楽曲がすべて1回以上登場する。",B:"次のパフォーマンス中、自身のAppealを+3する。",C:null,skill:"hiraoka"},{id:31,no:"No.31",name:"宮田愛萌",attr:"クール",group:"日向坂46",generation:"2期生",tags:["2期生","日向坂46","疲労回復","総疲労値"],themeTags:["疲労回復","総疲労値"],base:4,A:"自チーム8人の総疲労値が10以下なら、自身のAppealを+2する。",Bcond:"R3以降のパフォーマンス終了時、自チーム8人の総疲労値が12以下。",B:"次のパフォーマンス中、自チームのステージ5人のAppealを+1する。",C:null,skill:"miyata"},{id:32,no:"No.32",name:"渡邉美穂",attr:"クール",group:"日向坂46",generation:"2期生",tags:["2期生","日向坂46","チャージ","フォーメーション固定"],themeTags:["チャ
