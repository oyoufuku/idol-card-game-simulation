nswers:["1ポイント","2ポイント","3ポイント"],correct:1,explanation:"差10未満の勝利1ポイント＋ENCOREの追加1ポイント＝2ポイントです。"}},{id:"team",title:"2. 8人と3曲でチームを作る",lead:"アイドル8人・楽曲3曲を選びます。毎回出場するのは5人、残り3人はBACKSです。",points:["最初は「デッキ選択」から構築済みデッキを選ぶと、8人と3曲がまとめて決まります。","「ランダム」にはオール・櫻坂・日向坂の3種類があります。所属指定ではアイドルと楽曲の両方を絞ります。","通常選択できる曲は20曲。「ジャマイカビール」「NO WAR in the future」は特定のBスキルから使う特殊楽曲で、選択3曲には入れません。","BACKSはAppeal合計に入りません。ただし、BACKSから働くAやB条件もあります。"],tryThis:"「クール・シンメ連動」のメンバーと曲を確認し、この画面の「デッキ別」も開いてみましょう。",rules:["G01"]},{id:"formation",title:"3. 配置と対面を覚える",lead:"CENTERが1枠、FRONTが2枠、MIDDLEが2枠。CENTERは位置得点が高い分、疲労も増えやすい枠です。",points:["カードをタップすると左側に詳細が出ます。そのあと移動先の枠をタップして配置を交換します。","対面はCENTER同士、FRONTとMIDDLEは相手の左右反対です。自分のFRONT-Lは相手のFRONT-Rを対象にします。","シンメは自分のFRONT同士、MIDDLE同士の相方。CENTERとBACKSにはシンメがありません。","R1の初期配置は「登場」ではありません。R2以降のBACKS→ステージが登場です。左右だけの入れ替えと、CENTER・FRONT・MIDDLE・BACKSの位置種別変更は区別します。"],visual:"formation",tryThis:"自分のFRONT-Lと相手のFRONT-Rを見つけ、対面を対象にするAを確認しましょう。",rules:["G02","G03"],quiz:{question:"自分のMIDDLE-Lの対面はどこ？",answers:["相手MIDDLE-L","相手MIDDLE-R","相手CENTER"],correct:1,explanation:"対戦相手の盤面が反転するので、MIDDLE-Lと相手MIDDLE-Rが向かい合います。"}},{id:"round",title:"4. 予測を見てパフォーマンス開始",lead:"楽曲を確認し、配置を決め、予測Appealの内訳を見てから実行します。",points:["予測Appealの数値をタップすると、誰のA・B・C・楽曲・疲労で増減したか確認できます。赤の＋と青の−を見比べましょう。","配置中の相手は前回の公開配置です。R1は初期配置を使います。相手の未確定配置を予知する数値ではないため、実行後の結果は変わることがあります。","CPU対戦は「CPU配置を決定」→「パフォーマンス開始」。同じ端末のP1/P2対戦は両側の配置を確認して開始します。","「おすすめ配置」で現在のCPUの考えを試せます。配置例もおすすめも、必ず勝てる手ではありません。","演出は「次へ」で1件ずつ読むこともできます。演出設定で自動進行をOFFにすると、誰が何をしたか追いやすくなります。"],tryThis:"1人だけ配置を変え、予測合計とその人の内訳がどう変わるか見てみましょう。",rules:[]},{id:"fatigue",title:"5. 疲労を管理して交代する",lead:"疲労は基本的にパフォーマンス終了時に増減し、次のAppeal計算に影響します。",points:["通常の位置疲労はCENTER＋3、FRONT＋2、MIDDLE＋1。BACKSでは−2、最低0です。カードや楽曲で変わる場合があります。","疲労0〜2は減点なし、3〜4はAppeal−1、5〜6は−2、7以上は−3。疲労表示の赤が強くなるほど、減点も大きくなります。","回復・増加軽減・疲労交換は別の効果です。「君はハニーデュー」はAppealの減点を軽減し、疲労値そのものは減らしません。","小坂は位置ボーナスだけでなく位置疲労と疲労ペナルティも2倍。基本の位置＋2と、終了時の疲労＋3を取り違えないようにしましょう。"],visual:"fatigue",tryThis:"疲れた出場者をBACKSへ下げ、交代後のAppealを比べましょう。回復役の効果が誰に届くかも確認します。",rules:["N02","N03"],quiz:{question:"通常のCENTERで、補正なしの終了時疲労増加はいくつ？",answers:["＋1","＋2","＋3"],correct:2,explanation:"CENTERはAppealの位置ボーナスが＋2、終了時疲労は＋3です。2つは別の数値です。"}},{id:"skills",title:"6. A・B条件・B・Cを読む",lead:"カードはAスキル、B条件、Bスキル、Cスキルの4欄で読みます。",points:["AはAUTO。能力文の条件を満たした時に働きます。BACKSでも働くか、登場が必要か、対象が誰かを確認します。","B条件は通常BURSTを起こす条件、BスキルはBURSTした時に得る効果です。条件と効果を別々に読みます。","CはCENTERに置いた時だけ有効なスキルです。ステージにいるだけでは発動しません。無効化される場合もあります。","「累計」は試合中の合計、「連続」は条件を外すと途切れます。カード文の末尾に、終了済みの実績や現在チャージを表示します。","条件達成のために得点を落としすぎないことも大切です。今の1ポイントと、次回に使えるBの両方を考えましょう。"],tryThis:"使いたい1人について、Aが働く配置・Bを狙う行動・Cを使うかの3点を説明してみましょう。",rules:["T01","G04","G05"]},{id:"burst",title:"7. BURSTで次の回につなげる",lead:"R1〜R6の終了処理で条件を満たすと、その場でBURSTします。発動を保留する操作はありません。",points:["通常BURSTは原則1人1試合1回。BURST開始時に本人の疲労が0になり、Bスキルを解決します。対象を選ぶBは、発動時に選択します。","【次回】と書かれた効果は次のパフォーマンス中に使います。交換・固定・永続補正など、BURST時点で反映する効果もあるので文面を確認します。","強制BURSTは条件と通常使用済み状態を無視してBを発動します。通常BURSTの使用権は消費しません。","R7終了時には新しくBURSTしません。R6終了時に始めたBURSTの効果はR7に使えます。","チャージ消費カードはBACKSで蓄積し、登場時に全消費。上限5、当該回の消費3以上がB条件です。再充填後も、再び登場できるようBACKSで過ごす回を考えましょう。"],tryThis:"R6に入ったら、R7で誰を出すか、今からどのBを使えるか確認しましょう。",rules:["B01","B02","B05","B06","T04"],quiz:{question:"R7終了時に初めてB条件を満たしたら？",answers:["次の試合へ効果を持ち越す","新しいBURSTは発生しない","その場でBだけ発動する"],correct:1,explanation:"R7終了時は条件判定・新規BURSTを行いません。R7用のBはR6までに準備します。"}},{id:"songs",title:"8. 楽曲とデッキの勝ち筋を見る",lead:"毎回、両チームは同じ楽曲で対戦します。曲の属性だけでなく、効果が自分と相手のどちらを助けるか読みましょう。",points:["R1〜R6は両者が選んだ計6枚を抽選順に使います。特殊楽曲への変更がある回は、通常楽曲カードを引かず消費もしません。","R7はポイントで負けている側の選択3曲から抽選。同点なら両者の選択曲から抽選します。特殊楽曲は候補に含まれません。","複数属性のカードは、持っている各属性の人数に数えます。PLAINは属性なしで、クール・キュート・ユーモアのどれにも数えません。","JOYFUL LOVEはパフォーマンス直前にBURST状態を解除し、継続加算なども消します。一方、解決済みの疲労交換・永続変更・固定やBURST履歴は巻き戻しません。","次は「デッキ別」で、主役・最初の配置・交代の目安を確認し、1試合遊んでみましょう。"],tryThis:"自分の3曲について「味方が得する場面」と「相手も得する場面」を1つずつ考えましょう。",rules:["G06","G07","C06"]}],Jr=[{name:"クール・シンメ連動",level:"はじめにおすすめ",goal:"クール3人以上とクールのシンメを保ち、序盤から得点を取る。",opening:[11,14,18,27,8],openingWhy:"山下瞳月をCENTER、遠藤光莉と武元をFRONTのシンメに。村山と小島はBACKSから支える。",early:"クール曲は武元・髙橋の条件を確認。山下のCと、遠藤光莉のクールのシンメを使う。",middle:"疲れた出場者を村山・大園などと交代。向井はリード中にAが働くので、得点状況で出し分ける。",encore:"クール人数とシンメを崩さず、低疲労の5人とR6までに用意したBを組み合わせる。",burst:"村山はクール曲でBACKS終了、山下はCENTER累計2回、武元はクール曲出場累計2回。条件がそれぞれ違う。",watch:["大園は通常時、味方のスキル・曲によるAppeal加算も受けない。","何歳の頃に戻りたいのか？は劣勢側への加算。先行中は相手を助ける。"]},{name:"チャージ・序盤安定",level:"応用",goal:"3人をBACKSで蓄積し、投入時のチャージ効果で得点差を作る。",opening:[26,25,43,48,31],openingWhy:"小坂・金村・竹内・好花・宮田で出場。渡邉美穂・渡辺莉奈・平尾帆夏の3人をBACKSに置く。",early:"竹内を出場させ、3コアの自然蓄積と追加チャージを使う。小坂の疲労、R2以降の好花のA、宮田の総疲労条件も見る。",middle:"消費3以上を目安に、勝てる回へコアを投入。竹内がいるため早く貯まる場合もあり、R5まで必ず待つ必要はない。",encore:"R5投入→R6をBACKS→R7再登場は一例。再充填とBACKS履歴を確認し、R7に実際に登場できる人を準備する。",burst:"3コアはその回に消費3以上でBURST。BACKSへ戻って最後の消費値まで再充填する。上限5。",watch:["美穂のAは消費チャージ数×2。美穂は自身のAppeal、莉奈は相手FRONT2人を消費数分ずつ減少、平尾は疲労の回復・付与が消費数×2。5消費の追加+2はない。CHARGE CPUも5待機を必須にせず、現在得点と将来価値を比較して投入する。","R1初期配置では登場消費しない。","BACKSへ戻った直後に置き直すだけで、毎回の登場効果が保証されるわけではない。","小坂は位置疲労も2倍。君はハニーデューは疲労値を回復しない。","おすすめ配置を押しても、この蓄積・投入順が固定されるわけではない。"]},{name:"BURST・連鎖と疲労",level:"応用",goal:"自軍のBURSTを連鎖させ、BURST中の強化と疲労管理で押す。",opening:[12,34,41,6,29],openingWhy:"松田里奈をCENTER。中嶋・森本と合わせてステージのユーモア3人を作り、石塚をFRONTへ。",early:"中嶋の条件を満たすユーモア3人を意識。森本の追加属性と曲を見て、反復BURSTを狙う。",middle:"松田の同時BURST反応と、BURST中の味方へのCを使う。正源司は疲労ペナルティを利用するので、回復だけを正解にしない。",encore:"R6までに次回用のBを用意する。富田の条件を狙うなら、ステージ5人全員のBURST経験を確認する。",burst:"中嶋は本人以外のユーモア1人を強制BURST。富田はステージ5人が経験者なら、本人を除くステージからランダム3人を強制BURSTする。",watch:["富田を出しただけでは条件を満たさない。BURST中人数とBURST経験者は別。","Make or Breakは非ユーモアの味方にも疲労を与える。","森田のBを狙う回はCENTERとFRONTのクール・ユーモア配置も組み直す。"]},{name:"移動・疲労軽減",level:"応用",goal:"登場・位置経験・シンメ変更を、加算と疲労軽減につなげる。",opening:[9,28,27,45,31],openingWhy:"村井CENTER、小西とクールの髙橋をシンメに。山下葉留花は出場して位置経験を増やす。",early:"R1は登場扱いにならない。R2以降にBACKSの3人をどう出すか考え、小西のクールの相方も確保する。",middle:"村井Cの登場者加算・位置疲労軽減を使う。3人同時登場のB条件を狙う回も、ステージの得点を確認する。",encore:"位置経験を積んだ山下や小西を使い、R6のBと低疲労の交代要員をR7へ残す。",burst:"山下はCENTER・FRONT・MIDDLEの経験、小西は異なる3人とのシンメ経験。村井は同じ回の登場3人を狙う。",watch:["左右の入れ替えだけでは、山下の新しい位置種別経験にならない。","山崎の敗北時Cと村井の登場Cは同時に使えない。CENTERを選ぶ。","動くこと自体では得点にならない。登場効果や相方が成立する交換を選ぶ。"]},{name:"多属性・属性数活用",level:"応用",goal:"ステージとBACKSの属性を組み、属性種類数や追加属性を得点に変える。",opening:[22,30,41,35,17],openingWhy:"森田CENTER、FRONTをクールの平岡とユーモアの森本に。清水を出し、BACKSを濱岸・小西・上村の3属性にする。",early:"森田のFRONT条件と清水のBACKS3属性を確認。平岡は出場して楽曲属性を経験させる。",middle:"平岡は3属性の曲を出場中に経験するとBを狙える。入れ替えた後も清水のBACKS3属性が成立するか見る。",encore:"蓄積した楽曲経験と、森本・森田の追加属性を使う。見たことのない魔物は現在の総属性数を双方で比べる。",burst:"森田はCENTER＋FRONTのクール・ユーモア、清水はBACKS3属性での出場累計2回、平岡は出場中の3曲属性を狙う。",watch:["3属性を持つ1人を、BACKSの別々の3人として数えることはできない。","小西は追加クールとのシンメや相手変更を利用する。交代後もBACKSの3属性を確認する。","選択曲はクール・キュート・ユーモア各1曲。実際に出る順番は選べない。"]},{name:"対スキル・封殺",level:"応用",goal:"相手の強いA・C・BURSTを止めながら、必要な得点を確保する。",opening:[7,19,36,20,14],openingWhy:"的野CENTERで相手Cを止め、田村をFRONT、藤吉を相手Aの加算を狙える枠へ。",early:"的野の対面A無効とC無効で、相手のどの得点源が消えるか予測内訳を見る。藤吉は対面本人のA加算を参照する。",middle:"藤嶌CENTERの属性妨害も使い分ける。遠藤光莉は藤吉とクールのシンメを作り、濱岸は楽曲属性の繰り返しを狙う。大園は通常時に味方の加算も拒否する。",encore:"R7の曲と相手の主力に合わせてCENTERを選ぶ。JOYFUL LOVEなら相手だけでなく自軍の継続Bも消える。",burst:"田村は自身が出場中の相手BACKSのBURSTに反応し、対象をCENTER固定・B無効にする。的野の反応Bは自身がFRONTにいる必要がある。",watch:["的野をCENTERに置いた回は、FRONTを要求する自身のB条件を狙えない。","JOYFUL LOVEでは田村A/Cの「BURST中の相手」への減少も働かなくなる。","無効化だけでなく、最終Appealと得点差も確認する。"]},{name:"疲労回復・持久戦",level:"基本",goal:"回復とBACKS休息で得点を維持し、相手の疲労失速を待つ。",opening:[26,48,39,42,2],openingWhy:"小坂CENTERを井上BACKSから回復。山口で最高疲労を回復し、小島はBACKSで交換の準備をする。",early:"小坂の位置得点と丹生の低疲労AUTOを使う。井上はBACKSならCENTERを−2、山口は最高疲労1人を回復する。",middle:"小坂を出し続けるだけでなく休息・小島の疲労交換も選ぶ。劣勢なら山崎の得点や敗北時Cも候補になる。",encore:"低疲労の5人を用意し、Right?では同じ疲労の人数を双方で確認。小坂・丹生・好花などのCENTERを使い分ける。好花のA/Cは両軍のBURST人数条件を確認する。",burst:"井上は疲労5以上が2人、小島はBACKS累計3回。小坂はCENTER終了時の疲労8以上なので、回復しすぎると条件到達が遅れる。",watch:["MCタイムは相手も回復する。","通常時の井上−2と山口−1だけでは、小坂の毎回のCENTER疲労＋6をすべて打ち消せない。","小坂のCは計算時の疲労0〜2が条件。回復量と対象を確認する。"]},{name:"疲労付与・高疲労妨害",level:"基本",goal:"相手を疲れさせ、疲労ペナルティと高疲労への妨害を重ねる。",opening:[23,34,16,21,29],openingWhy:"守屋CENTER、石塚と大沼をFRONTに。増本で広く疲労を与え、正源司は自身の疲労も利用する。",early:"大沼・石塚の対面を確認。増本は両軍の非ユーモアを疲れさせるので、自軍への負担も見る。",middle:"疲れた相手へ守屋のA/Cを当てる。Cは疲労2〜3で−1、4以上で−2。相手が交代するなら対面を調整し、山下葉留花の移動妨害も候補にする。",encore:"桜月は疲労減点を双方2倍にする。自軍の疲労も確認し、相手だけを疲れさせた状態で使えると有利。",burst:"大沼は対面疲労7以上、石塚はFRONTで累計3回（左右合算）。増本のBは次回開始前の対面へ疲労＋8を与える。",watch:["守屋のBは対面の実減少から上昇を引いた純減3以上。単純な疲労値ではない。","回復・マイナス無効で付与を防がれる場合がある。","平尾はBACKSでチャージ5を貯め、満充填で登場。R6の再充填はR7へ温存する。"]},{name:"対単一属性・クールメタ",level:"応用",goal:"属性を偏らせた相手を人数参照で弱め、CENTERを使い分ける。",opening:[40,1,3,37,7],openingWhy:"河田CENTERで最多属性を妨害し、石森・小田倉を出場させる。宮地は同じ枠を維持して対面妨害を育てる。",early:"相手のクール人数・単独最多属性を見て、石森と小田倉の対面を選ぶ。人数は元属性ではなく現在属性で数える。",middle:"河田CENTERの人数参照と谷口CENTERのキュート構成を使い分け、幸坂をBACKSに置いて相手CENTERへの減少を重ねる。",encore:"保持した宮地の妨害やR6までのBを使う。相手が属性を分散した場合も、的野のAUTO無効を対面へ当てる。相手CENTERのCを止める回は的野CENTERへ切り替える。",burst:"小田倉は出場累計2回＋相手ステージ2属性以下、河田は相手の単独最多属性4人以上。的野はFRONTで相手BURSTに反応して位置固定を狙う。",watch:["幸坂のAUTOはBACKSにいる間だけ。相手CENTERのスキルは無効にしない。","小田倉Bのクール上書きは、相手のクール向け能力も助ける場合がある。","最多属性が同数なら「単独最多」は成立しない。"]},{name:"櫻坂選抜",level:"基本",goal:"クールの出役と、森田・的野の属性を組み合わせて得点と妨害を両立する。",opening:[11,7,20,22,10],openingWhy:"山下瞳月CENTER。クール3人に森田のキュート、的野のユーモアを合わせ、ステージ3属性も作る。",early:"Start over!ではクールの得点を狙う。静寂の暴力でも山下のCは楽曲によって無効化されない。",middle:"井上・幸坂をBACKS支援に使う回と、疲れた出役を休ませる回を使い分ける。村山のクール曲BACKS条件も見る。",encore:"UDAGAWA GENERATIONならステージの3属性を再確認。必要なら森田・的野の位置を調整し、低疲労の出役へ替える。",burst:"山下のCENTER経験、村山のクール曲BACKS、藤吉の実上昇合計をそれぞれ狙う。森田のBはCENTERとFRONT属性の準備が必要。",watch:["静寂の暴力は山下以外の自軍Cも止める。","ステージ3属性を崩すと、UDAGAWA GENERATIONで自軍も減少する。","櫻坂所属そのものに追加ボーナスはない。"]},{name:"日向坂選抜",level:"基本",goal:"キュートとユーモアで属性妨害・位置維持・疲労管理を組み合わせる。",opening:[40,37,39,41,48],openingWhy:"河田CENTER、宮地の枠を決め、丹生を低疲労で出場。山口はBACKSからも最高疲労を回復する。",early:"相手の単独最多属性を河田で妨害。宮地は同じステージ枠を維持し、森本の追加属性と曲も確認する。",middle:"丹生の疲労を休息・山口で管理し、濱岸の同じ楽曲属性の連続も狙う。回復対象は最高疲労なので丹生に固定されない。",encore:"JOYFUL LOVEなら好花CENTERの低BURST人数条件も候補。河田・藤嶌と比較して得点が高い運用を選ぶ。",burst:"宮地は同じステージ枠3回、濱岸はA累計2回。森本は追加属性と曲が合えば反復BURSTできる。",watch:["PLAINの藤嶌CENTERと、河田の相手属性人数参照は競合する。","JOYFUL LOVEは森本のBURST加算・山口のBURST中AUTO強化も消す。","見たことのない魔物とOne choiceは自軍を不利にする場合もある。"]},{name:"指定8人・妨害とBURST",level:"応用",goal:"指定8人の妨害とBURSTを、相手に応じたCENTER・シンメで使い分ける。",opening:[7,19,40,41,1],openingWhy:"的野CENTER、田村FRONTで妨害。森本・石森を出場させ、小島はBACKSで支える。",early:"的野で相手Cを止めるか、河田で最多属性を狙うか選ぶ。田村は相手BACKSのBURSTに反応できるよう出場させる。",middle:"松田里奈をCENTERにする回は、自軍のBURST中人数を確認。 容の整理"},{code:"G07",category:"用語",title:"最多属性・最高疲労の同数",summary:"単独最多は同数最多があると成立しない。最高疲労の同数はランダム。",detail:"河田A/B/Cの単独最多属性は、同数最多なら存在しない。河田Bで対象にする属性は条件判定時に記録し、次回の人数で選び直さない。山口A・平尾Aで最高疲労が複数いる場合は、そのチームの同率候補からランダムに1人を対象とする。本人や両軍で同じアイドルがいる場合も、チーム別に判定する。",relatedCards:[40,42,44],status:"既存ルール・回答済み内容の整理"},{code:"T01",category:"タイミング",title:"A・B・Cの前提",summary:"A＝AUTO、B＝BURSTスキル、C＝CENTER SKILL。",detail:"CはそのメンバーがCENTERにいるパフォーマンス中だけ有効。Aは能力文の条件・対象に従い、BACKSから働くものもある。通常のBは条件達成で開始し、特記したタイミングに効果を適用する。カードの見出しで分かる前提を本文で繰り返さない。",relatedCards:[],status:"既存ルール・回答済み内容の整理"},{code:"T02",category:"タイミング",title:"次回・開始前・終了後",summary:"【次回】は次の1パフォーマンス中。【次回開始前】はその計算前。",detail:"B本文で時期の指定がない交換・固定・永続変更などはBURST解決時に行う。【次回】のAppeal・属性・免疫などは次のパフォーマンスに有効。【次回終了後】は次の終了処理で適用する。R7終了後はBURST条件を判定せず、新たな通常・強制・反応BURSTを開始しない。R6までに開始したBURSTはR7のパフォーマンスに有効。",relatedCards:[],status:"既存ルール・回答済み内容の整理"},{code:"T03",category:"タイミング",title:"新しい開始前Bの順序",summary:"JOYFUL LOVE・免疫準備→開始前B→楽曲の疲労→A/C。",detail:"双方の配置確定→JOYFUL LOVEによる解除→登場・属性・免疫の準備→新しい開始前B→楽曲の疲労処理→既存A/Cの開始前処理→Appeal計算。増本・石塚・山下葉留花の新Bを同じ段階に置く。山口が選ぶ最高疲労の対象は、この順序で変化した後の疲労を使う。",relatedCards:[21,34,45],status:"ユーザー回答で確定（実装済み）"},{code:"T04",category:"タイミング",title:"終了処理とB条件",summary:"終了時の疲労は通常疲労加算・BACKS回復後に判定する。",detail:"得点を確定し、位置疲労・BACKS回復・終了時の回復やチャージ等を処理してから通常B条件を判定する。通常条件は、同じ終了処理で新しく始まるBURSTの即時効果で変化する前の状態を両軍分判定する。反応型のBは、その後のBURST開始イベントで発動する。R7終了時はこの条件判定・新規BURSTを行わない。終了時予約効果と再判定の例外は個別補足に従う。",relatedCards:[],status:"既存ルール・回答済み内容の整理"},{code:"B01",category:"BURST",title:"通常BURST",summary:"条件達成後、同じ終了処理内で即BURST。発動保留はない。",detail:"通常BURSTは使用済みになると条件を満たしても再発動しない。再使用可能にする効果がある場合だけ再び使用できる。BURST開始時には、本人の疲労を0にし、BURST回数を1増やす。Bがないのではなく、固有Bと共通処理を分けて扱う。",relatedCards:[],status:"既存ルール・回答済み内容の整理"},{code:"B02",category:"BURST",title:"強制BURST",summary:"条件と通常使用済みを無視してBURSTし、Bも発動する。",detail:"通常BURSTの使用済み状態は消費せず、使用済みのメンバーも対象にできる。本人疲労0・BURST回数加算は行う。同じ連鎖内で発動済みのメンバーは抽選候補から除外し、再発動させない。複数対象は重複なしで選び、1人ずつ解決する。候補が指定人数未満なら残る候補だけ、0人なら対象への効果は不発。",relatedCards:[6,47,48],status:"既存ルール・回答済み内容の整理"},{code:"B03",c に強制BURSTさせる。対象のB効果も発動する。強制BURSTは通常BURST使用済み状態を消費せず、通常BURST使用済みのメンバーも対象にできる。",C:null,skill:"nakashima"},{id:7,no:"No.07",name:"的野美青",attr:"ユーモア",group:"櫻坂46",generation:"3期生",tags:["3期生","櫻坂46","対スキル","対センター"],themeTags:["対スキル","対センター"],base:5,A:"対面の相手メンバーのAUTOを無効にする。",Bcond:"自身がFRONT-LまたはFRONT-Rにいる状態で、相手メンバーがBURSTを開始したとき。R1でも成立する。",B:"相手メンバー1人を選び、次のパフォーマンス終了まで現在のポジションに固定する。",C:"相手CENTERのCENTER SKILLを無効にし、自身の疲労値を+2する。",skill:"matono"},{id:8,no:"No.08",name:"向井純葉",attr:"クール",group:"櫻坂46",generation:"3期生",tags:["3期生","櫻坂46","Appeal上昇","勝ちポイント"],themeTags:["Appeal上昇","勝ちポイント"],base:4,A:"ラウンド開始時点で自チームがポイントで勝っているなら、自身のAppealを+2する。",Bcond:"自チームが勝利したパフォーマンスに自身がステージで参加した回数が、試合中累計2回に達する。判定時も自身がステージにいる。",B:"次のパフォーマンス中、自身のAppealを自チームの現在ポイント数だけプラスする（最大+3）。",C:null,skill:"mukai"},{id:9,no:"No.09",name:"村井優",attr:"ユーモア",group:"櫻坂46",generation:"3期生",tags:["3期生","櫻坂46","フォーメーション移動","Appeal上昇"],themeTags:["フォーメーション移動","Appeal上昇"],base:4,A:"そのラウンドに自身がBACKSからステージへ移動した場合、そのパフォーマンス中、自身にマイナス無効を適用する。R1の初期配置は移動に数えない。",Bcond:"同一ラウンドに自チームの3人以上がBACKSからステージへ移動する。R1の初期配置は数えない。",B:"次のパフォーマンス中、そのラウンドにBACKSからステージへ移動した味方メンバーのAppealを+1し、そのメンバーにマイナス無効を適用する。R1の初期配置は移動に数えない。本人の再登場・出場は要求しない。",C:"そのラウンドにBACKSからステージへ移動した味方メンバーのAppealを+1し、そのパフォーマンスの位置由来疲労増加を1軽減する（最低0）。R1の初期配置は移動に数えない。",skill:"murai"},{id:10,no:"No.10",name:"村山美羽",attr:"クール",group:"櫻坂46",generation:"3期生",tags:["3期生","櫻坂46","クール","単一属性"],themeTags:["クール","単一属性"],base:4,A:"自チームのステージにクールが3人以上なら、自身のAppealを+2する。",Bcond:"クール楽曲でBACKSとしてパフォーマンス終了。",B:"次のパフォーマンス中、自チームのクールメンバーのAppealを+1する。",C:null,skill:"murayama"},{id:11,no:"No.11",name:"山下瞳月",attr:"クール",group:"櫻坂46",generation:"3期生",tags:["3期生","櫻坂46","センター","クール"],themeTags:["センター","クール"],base:2,A:"クール楽曲で自身がCENTERなら、自身のAppealを+1する。",Bcond:"CENTERで累計2パフォーマンスを終了する。",B:"BURST中、自身のAppealを+2し、自身にマイナス無効を適用する。",C:"CENTERなら自身のAppealを+5する。このCENTER SKILLは楽曲によるCENTER SKILL無効化を受けない。",skill:"yamashita"},{id:12,no:"No.12",name:"松田里奈",attr:"ユーモア",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","バースト","Appeal上昇"],themeTags:["バースト","Appeal上昇"],base:3,A:"自チームの累計BURST回数（通常BURST・強制BURSTを含む）が5回以上なら、自身のAppealを+3する。",Bcond:"同じパフォーマンス終了処理内で、自身以外の味方2人以上がBURSTを開始する。",B:"次のパフォーマンス終了後、味方1人をランダムに選び、そのメンバーの通常BURST使用済み状態をリセットする。累計BURST回数は減らさない。",C:"BURST中の味方メンバーのAppealを+2する。",skill:"matsuda"},{id:13,no:"No.13",name:"井上梨名",attr:"ユーモア",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","疲労回復","総疲労値"],themeTags:["疲労回復","総疲労値"],base:3,A:"シンメの疲労値を-2する。自身がBACKSにいる場合は、シンメへの効果の代わりに味方CENTERの疲労値を-2する（最低0）。",Bcond:"パフォーマンス終了時、自チーム8人のうち疲労値5以上のメンバーが2人以上いる。自身の位置・BACKS経験回数は問わない。",B:"自チーム8人全員の疲労値を-2する（最低0）。",C:null,skill:"inoue"},{id:14,no:"No.14",name:"遠藤光莉",attr:"クール",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","クール","楽曲"],themeTags:["クール","楽曲"],base:3,A:"シンメがクールなら、自身とシンメのAppealをそれぞれ+1する。",Bcond:"パフォーマンス終了時、CENTER・FRONT-L・FRONT-Rの3人全員がクール。",B:"次のパフォーマンスの楽曲を「ジャマイカビール」に変更する。",C:null,skill:"endo_hikari"},{id:15,no:"No.15",name:"大園玲",attr:"クール",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","対スキル","Appeal増減"],themeTags:["対スキル","Appeal増減"],base:4,A:"自身はスキルおよび楽曲によるAppealの増減を受けない。",Bcond:"R5以降に、自身がFRONTまたはCENTERでパフォーマンスを終了する。",B:"BURST中、自身のAUTOによるAppeal増減無効を解除し、スキル・楽曲由来のAppeal上昇量を2倍にする。スキル・楽曲由来のAppeal減少は受けない。",C:null,skill:"ozono"},{id:16,no:"No.16",name:"大沼昌保",attr:"ユーモア",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","疲労付与","バースト"],themeTags:["疲労付与","バースト"],base:3,A:"対面の疲労値を+2する。",Bcond:"パフォーマンス終了時、対面の疲労値が7以上。",B:"BURST中、自身のAppealを+5する。BURSTしたパフォーマンス終了後、自身の基礎Appealを永続的に-1する（最低0）。その後、自身の通常BURST使用済み状態をリセットする。続くBURST条件判定で条件を満たした場合は、同じ終了処理内で再び通常BURSTする。",C:null,skill:"onuma"},{id:17,no:"No.17",name:"幸坂茉里乃",attr:"キュート",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","フォーメーション固定","Appeal低下"],themeTags:["フォーメーション固定","Appeal低下"],base:2,A:"自身がBACKSにいる間、相手CENTERのAppealを-2する。",Bcond:"キュート楽曲でステージ5枠のいずれかに配置され、パフォーマンスを終了する。",B:"相手メンバー1人を選び、次のパフォーマンス終了までFRONT-Rに固定し、そのメンバーのAppealを-6する。",C:null,skill:"kousaka"},{id:18,no:"No.18",name:"武元唯衣",attr:"クール",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","クール","楽曲"],themeTags:["クール","楽曲"],base:3,A:"楽曲属性がクールなら、自身のAppealを+3する。",Bcond:"自身がステージでクール楽曲のパフォーマンスを試合中累計2回終了する。判定時もステージにいる。",B:"次のパフォーマンスの楽曲属性をクールとして扱い、自身のAppealを+2する。",C:null,skill:"takemoto"},{id:19,no:"No.19",name:"田村保乃",attr:"キュート",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","対バースト","Appeal低下"],themeTags:["対バースト","Appeal低下"],base:4,A:"対面がBURST中なら、その対面のAppealを-4する。",Bcond:"自身がステージにいる状態で、相手メンバーがBACKSからBURSTを開始したとき。",B:"同じパフォーマンス終了処理内でBACKSからBURSTした相手が複数いる場合も1回だけ発動し、その中からランダムに1人を選ぶ。選ばれた相手を次のパフォーマンス終了までCENTERに固定し、Bスキルを無効にする。元のCENTERメンバーはBACKSへ移動する。",C:"BURST中の相手メンバーのAppealを-2する。",skill:"tamura"},{id:20,no:"No.20",name:"藤吉夏鈴",attr:"クール",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","対スキル","Appeal上昇"],themeTags:["対スキル","Appeal上昇"],base:4,A:"対面の相手AUTOによるAppeal上昇値と同じ値だけ、自身のAppealも上昇する。",Bcond:"パフォーマンス終了時、そのパフォーマンス中に自身へ実適用されたAUTO・BURST・CENTER SKILL・楽曲によるAppeal上昇量の合計が4以上。位置ボーナス・基礎Appealは含めない。",B:"そのパフォーマンス中に自身へ実適用された自身のAUTOによるAppeal上昇分を、次のパフォーマンスにも引き継ぐ。",C:"自チームのクールメンバーは、相手AUTOによるAppeal減少を受けない。",skill:"fujiyoshi"},{id:21,no:"No.21",name:"増本綺良",attr:"ユーモア",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","ユーモア","疲労付与"],themeTags:["ユーモア","疲労付与"],base:3,A:"両チームのユーモアではないメンバーの疲労値を+1する。",Bcond:"自身がステージでパフォーマンスを終了し、その時点の相手8人の総疲労値が24以上。",B:"次のパフォーマンス開始前、双方の配置確定後に、その時点の自身の対面メンバーの疲労値を+8する。その時点で自身がBACKSなら対象がなく不発。",C:null,skill:"masumoto"},{id:22,no:"No.22",name:"森田ひかる",attr:"キュート",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","多属性","Appeal低下"],themeTags:["多属性","Appeal低下"],base:5,A:"自チームのステージにクールとユーモアが1人以上ずついるなら、対面のAppealを-1する。",Bcond:"自身がCENTERでパフォーマンスを終了し、自チームのFRONT-LとFRONT-Rがクールとユーモアを1人ずつ担当できる。左右は問わない。自身をCENTERへ移動・固定する効果ではない。",B:"次のパフォーマンス中、自身を本来のキュートに加えてクール・ユーモアとしても扱い、対面のAppealを-2する。",C:"相手CENTERのAppealを、自チームのステージに存在する属性種類数だけマイナスする。",skill:"morita"},{id:23,no:"No.23",name:"守屋麗奈",attr:"キュート",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","疲労付与","Appeal低下"],themeTags:["疲労付与","Appeal低下"],base:4,A:"対面の疲労値が3以上なら、その対面のAppealを-2する。",Bcond:"パフォーマンス終了時、そのパフォーマンスの対面に実適用された、位置ボーナス以外のAppeal減少合計からAppeal上昇合計を差し引いた純減が3以上。減少には疲労ペナルティを含み、基礎Appeal・位置ボーナスの増減は含めない。",B:"そのパフォーマンス中に対面へ実適用された自身のAUTOによるAppeal下降分を、次のパフォーマンスにも引き継ぐ。さらにBURST開始時の対面1人を、現在の位置に次のパフォーマンス終了まで固定する。",C:"相手ステージの疲労値が2〜3のメンバーはAppealを-1、4以上のメンバーはAppealを-2する。",skill:"moriya"},{id:24,no:"No.24",name:"山崎天",attr:"クール",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","負けポイント","Appeal上昇"],themeTags:["負けポイント","Appeal上昇"],base:3,A:"ラウンド開始時点で自チームがポイントで負けている場合のみ、相手チームの現在ポイント数だけ自身のAppealをプラスする。",Bcond:"自チームが2パフォーマンス連続で敗北する。引き分けは連敗に含めず、連敗数をリセットする。",B:"自身の基礎Appealを永続的に+2する。複数回発動した場合は重複する。",C:"自身がCENTERで自チームが敗北したとき、その時点でステージにいる味方の疲労値を-1し、その味方は次のパフォーマンスのみAppeal+1。引き分けでは発動しない。",skill:"yamasaki"},{id:25,no:"No.25",name:"金村美玖",attr:"クール",group:"日向坂46",generation:"2期生",tags:["2期生","日向坂46","フォーメーション固定","Appeal上昇"],themeTags:["フォーメーション固定","Appeal上昇"],base:4,A:"前ラウンドと同じポジションでパフォーマンスする場合、そのポジションを連続で維持した回数だけ自身のAppealを+1する。R1は発動しない。",Bcond:"同一のステージ枠で累計4回パフォーマンスを終了する。判定時もその枠にいる。BACKSはカウントしない。",B:"BURST中、自チームのポジションボーナスを2倍にする。",C:"前ラウンドと同じポジションにいる味方メンバーのAppealを+1する。R1は発動しない。",skill:"kanemura"},{id:26,no:"No.26",name:"小坂菜緒",attr:"クール",group:"日向坂46",generation:"2期生",tags:["2期生","日向坂46","センター","フォーメーション固定"],themeTags:["センター","フォーメーション固定"],base:5,A:"自身が受けるポジション由来のAppealボーナスとポジション由来の疲労増加を、各種加算・軽減を反映した後に2倍する。自身の疲労ペナルティによるAppeal減少量も2倍する。",Bcond:"CENTERかつ自身の疲労値が8以上でパフォーマンス終了。",B:"BURST中、自身のAppealを+4する。BURSTしたパフォーマンス終了後、自身の疲労値を+5する。",C:"自身の疲労値が0～2なら、自チームのポジションボーナスをそれぞれ+1する。",skill:"kosaka"},{id:27,no:"No.27",name:"髙橋未来虹",attr:"クール",group:"日向坂46",generation:"3期生",tags:["3期生","日向坂46","クール","単一属性"],themeTags:["クール","単一属性"],base:4,A:"自チームのステージにクールが3人以上なら、自身のAppealを+2する。",Bcond:"自身がステージにおり、クール楽曲かつ味方CENTERがクールの状態でパフォーマンス終了。",B:"自身の基礎Appealを永続的に+1する。",C:null,skill:"takahashi"},{id:28,no:"No.28",name:"小西夏菜実",attr:"クール",group:"日向坂46",generation:"4期生",tags:["4期生","日向坂46","クール","フォーメーション移動"],themeTags:["クール","フォーメーション移動"],base:4,A:"シンメがクールなら、自身とシンメのAppealをそれぞれ+1する。",Bcond:"自身が累計で異なる3人とシンメになってパフォーマンスを終了する。",B:"次のパフォーマンス中、自身とその時点のシンメのAppealをそれぞれ+2する。",C:null,skill:"konishi"},{id:29,no:"No.29",name:"正源司陽子",attr:"クール",group:"日向坂46",generation:"4期生",tags:["4期生","日向坂46","対疲労付与","Appeal上昇"],themeTags:["対疲労付与","Appeal上昇"],base:4,A:"自身が疲労ペナルティを受けているなら、自身のAppealを+2する。",Bcond:"自身が疲労ペナルティを3パフォーマンス連続で受ける。",B:"BURST中、自身のAppealを+3する。",C:"疲労ペナルティを受けている味方メンバーのAppealを+1する。",skill:"shogenji"},{id:30,no:"No.30",name:"平岡海月",attr:"クール",group:"日向坂46",generation:"4期生",tags:["4期生","日向坂46","楽曲","多属性"],themeTags:["楽曲","多属性"],base:3,A:"その試合で登場済みの楽曲属性の種類数だけ自身のAppealを+1する（最大+3）。",Bcond:"自身がステージでクール・キュート・ユーモアの3属性の楽曲を各1回以上終了する。",B:"次のパフォーマンス中、自身のAppealを+5する。",C:null,skill:"hiraoka"},{id:31,no:"No.31",name:"宮田愛萌",attr:"クール",group:"日向坂46",generation:"2期生",tags:["2期生","日向坂46","疲労回復","総疲労値"],themeTags:["疲労回復","総疲労値"],base:4,A:"自チーム8人の総疲労値が10以下なら、自身のAppealを+2する。",Bcond:"R3以降のパフォーマンス終了時、自チーム8人の総疲労値が15以下。",B:"次のパフォーマンス中、自チームのステージ5人のAppealを+1する。",C:null,skill:"miyata"},{id:32,no:"No.32",name:"渡邉美穂",attr:"クール",group:"日向坂46",generation:"2期生",tags:["2期生","日向坂46","チャージ","フォーメーション固定"],themeTags:["チャージ","フォーメーション固定"],base:2,A:"BACKSでラウンド終了するたび自身のチャージを+1する（最大5）。次にステージ入りしたパフォーマンスでは、消費チャージ数の2倍だけ自身のAppealをプラスし、そのチャージを0にする。",Bcond:"チャージ3以上の状態からステージ入りする。",B:"BURST解決時、自身がステージにいる場合、味方BACKS1人と位置を入れ替える。その後、最後に実消費した自身のチャージを、消費直前の値まで回復する。このパフォーマンスで未消費の場合も、最後に消費した値まで回復する。",C:null,skill:"watanabe_miho"},{id:33,no:"No.33",name:"上村ひなの",attr:"キュート",group:"日向坂46",generation:"3期生",tags:["3期生","日向坂46","基礎値","Appeal低下"],themeTags:["基礎値","Appeal低下"],base:3,A:"対面の有効な基礎Appealが4以上なら、その対面のAppealを-3する。",Bcond:"自身のAUTOで1以上のAppeal減少を実適用したパフォーマンスが、試合中累計3回以上。位置は問わず、同一パフォーマンスで複数人へ適用しても1回として数える。",B:"次のパフォーマンス中、自身のAUTOを対面1人ではなく相手ステージ全員に適用する。",C:"自身がCENTERにいるパフォーマンス中のみ、相手メンバー全員の基礎Appealを一時的に+1した後、Appealを-1する。CENTERを外れたら基礎Appealは元に戻る。",skill:"kamimura"},{id:34,no:"No.34",name:"石塚瑶季",attr:"キュート",group:"日向坂46",generation:"4期生",tags:["4期生","日向坂46","疲労付与","フォーメーション固定"],themeTags:["疲労付与","フォーメーション固定"],base:4,A:"自身がFRONTなら、Appeal計算前に対面の疲労値を+2する。",Bcond:"自身がFRONTでパフォーマンスを累計3回終了する。判定時もFRONTにいる。",B:"次のパフォーマンス中、相手FRONT-LとFRONT-Rのポジションボーナスを0にする。さらにそのパフォーマンス開始前、双方の配置確定後に相手FRONT-LとFRONT-Rの疲労値をそれぞれ+2する。",C:null,skill:"ishizuka"},{id:35,no:"No.35",name:"清水理央",attr:"キュート",group:"日向坂46",generation:"4期生",tags:["4期生","日向坂46","多属性","対スキル"],themeTags:["多属性","対スキル"],base:3,A:"自チームのステージ5人に存在する属性種類数と同じ値だけ、対面のAppealをマイナスする。",Bcond:"自チームのBACKS3人がそれぞれ異なる属性を1種類ずつ担当でき、かつ自身がステージにいるパフォーマンスを、試合中累計2回終了する。判定時も同じ条件を満たす。",B:"次のパフォーマンス中、自チームのクールまたはユーモア属性を持つメンバーにマイナス無効を適用する。",C:null,skill:"shimizu"},{id:36,no:"No.36",name:"藤嶌果歩",attr:"キュート",group:"日向坂46",generation:"4期生",tags:["4期生","日向坂46","キュート","楽曲"],themeTags:["キュート","楽曲"],base:4,A:"キュート楽曲なら、対面のAppealを-2する。",Bcond:"自身がFRONTまたはCENTERで、キュート楽曲のパフォーマンスを累計2回終了する。",B:"次のパフォーマンス中、現在の楽曲属性を持たない相手メンバー全員のAppealを-1する。",C:"自身がCENTERにいるパフォーマンス中のみ、相手メンバー全員の属性をPLAIN（属性なし）にする。PLAINは他の属性付与・変更より最優先で、クール・キュート・ユーモアの人数に数えない。",skill:"fujishima"},{id:37,no:"No.37",name:"宮地すみれ",attr:"キュート",group:"日向坂46",generation:"4期生",tags:["4期生","日向坂46","フォーメーション固定","Appeal低下"],themeTags:["フォーメーション固定","Appeal低下"],base:4,A:"前ラウンドと同じポジションでパフォーマンスする場合、そのポジションを連続で維持した回数だけ対面のAppealを-1する。R1は発動しない。",Bcond:"自身が同じステージ枠で3パフォーマンス連続で終了する。BACKSはカウントしない。",B:"BURST開始時の対面1人の基礎Appealを永続的に-2する（最低0）。複数回適用した場合は重複する。相手全体のポジションボーナス無効と、追加の対面Appeal-2は削除する。",C:null,skill:"miyachi"},{id:38,no:"No.38",name:"渡辺莉奈",attr:"キュート",group:"日向坂46",generation:"4期生",tags:["4期生","日向坂46","チャージ","フォーメーション固定"],themeTags:["チャージ","フォーメーション固定"],base:3,A:"BACKSでラウンド終了するたび自身のチャージを+1する（最大5）。次にステージ入りしたパフォーマンスでは、相手FRONT-LとFRONT-RのAppealをそれぞれ消費チャージ数だけマイナスし、そのチャージを0にする。",Bcond:"チャージ3以上の状態からステージ入りする。",B:"BURST解決時、自身がステージにいる場合、味方BACKS1人と位置を入れ替える。その後、最後に実消費した自身のチャージを、消費直前の値まで回復する。このパフォーマンスで未消費の場合も、最後に消費した値まで回復する。",C:null,skill:"watanabe_rina"},{id:39,no:"No.39",name:"丹生明里",attr:"キュート",group:"日向坂46",generation:"2期生",tags:["2期生","日向坂46","疲労回復","Appeal低下"],themeTags:["疲労回復","Appeal低下"],base:4,A:"自身の疲労値が0～2なら、対面のAppealを-1する。",Bcond:"自身がステージで疲労ペナルティの対象とならずにパフォーマンスを終了した回数が、試合中累計3回に達する。判定時もステージにいる。",B:"次のパフォーマンス中、相手FRONT-LとFRO
