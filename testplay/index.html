NT-L↔FRONT-R、MIDDLE-L↔MIDDLE-Rは種別の移動ではない。「位置」や「同じ枠」は左右を区別する。経験位置種別数は4種類まで。",relatedCards:[9,32,38,44,45],status:"既存ルール・回答済み内容の整理"},{code:"G03",category:"用語",title:"対面・シンメ",summary:"対面は相手の同じ枠。シンメは同じ列の左右の相方。",detail:"FRONT-Lの対面は相手FRONT-L、MIDDLE-Rの対面は相手MIDDLE-R。盤面の見た目を反転しても対応枠は変えない。BACKSには対面がなく、CENTER・BACKSにはシンメがない。対象が存在しない部分の効果は不発になる。",relatedCards:[],status:"既存ルール・回答済み内容の整理"},{code:"G04",category:"用語",title:"累計・連続・連続維持数",summary:"累計は試合中保持。連続は条件を外すと途切れる。",detail:"「累計2回」等は2回以上の意味で、通常BURSTを再使用可能にしても経験履歴は失わない。「今回も出場／その枠で終了」と明記した条件は今回の配置も必要。3ラウンド連続出場は最初の1回を含む。一方、金村A・宮地Aの「連続維持数」は前回と同じ位置に残った回数で、初回0、次に同じ位置なら1、その次は2。R1は前回との比較能力が働かない。",relatedCards:[25,37],status:"既存ルール・回答済み内容の整理"},{code:"G05",category:"用語",title:"A成功・実適用・回数",summary:"防御や軽減後、実際に1以上増減した回を成功とする。",detail:"石森・上村の新B条件は、それぞれ本人Aが実際に相手Appealを減らしたパフォーマンスを数える。同じ回で複数人に当てても1回。単に能力を表示しただけでは成功ではない。実適用値は、効果無効・盾・軽減などを反映した値。濱岸の「A発動」は現行の発動履歴を使い、今回の編集で別の成功条件に変更しない。",relatedCards:[1,20,23,33,46],status:"既存ルール・回答済み内容の整理"},{code:"G06",category:"用語",title:"属性とPLAIN",summary:"複数属性は保有する各属性に数える。PLAINは属性なし。",detail:"PLAINはクール・キュート・ユーモアのどれにも数えず、属性付与・上書きより優先する。属性種類数と属性人数を区別する。2人でクール・ユーモアを各1人担当する条件では、左右不問で別々のメンバーへ1属性ずつ割り当てる。1人が両属性を持っても、その1人だけで2人分にはしない。",relatedCards:[3,5,22,35,36,40,41],status:"既存ルール・回答済み内容の整理"},{code:"G07",category:"用語",title:"最多属性・最高疲労の同数",summary:"単独最多は同数最多があると成立しない。最高疲労の同数はランダム。",detail:"河田A/B/Cの単独最多属性は、同数最多なら存在しない。河田Bで対象にする属性は条件判定時に記録し、次回の人数で選び直さない。山口A・平尾Aで最高疲労が複数いる場合は、そのチームの同率候補からランダムに1人を対象とする。本人や両軍で同じアイドルがいる場合も、チーム別に判定する。",relatedCards:[40,42,44],status:"既存ルール・回答済み内容の整理"},{code:"T01",category:"タイミング",title:"A・B・Cの前提",summary:"A＝AUTO、B＝BURSTスキル、C＝CENTER SKILL。",detail:"CはそのメンバーがCENTERにいるパフォーマンス中だけ有効。Aは能力文の条件・対象に従い、BACKSから働くものもある。通常のBは条件達成で開始し、特記したタイミングに効果を適用する。カードの見出しで分かる前提を本文で繰り返さない。",relatedCards:[],status:"既存ルール・回答済み内容の整理"},{code:"T02",category:"タイミング",title:"次回・開始前・終了後",summary:"【次回】は次の1パフォーマンス中。【次回開始前】はその計算前。",detail:"B本文で時期の指定がない交換・固定・永続変更などはBURST解決時に行う。【次回】のAppeal・属性・免疫などは次のパフォーマンスに有効。【次回終了後】は次の終了処理で適用する。R7終了後はBURST条件を判定せず、新たな通常・強制・反応BURSTを開始しない。R6までに開始したBURSTはR7のパフォーマンスに有効。",relatedCards:[],status:"既存ルール・回答済み内容の整理"},{code:"T03",category:"タイミング",title:"新しい開始前Bの順序",summary:"JOYFUL LOVE・免疫準備→開始前B→楽曲の疲労→A/C。",detail:"双方の配置確定→JOYFUL LOVEによる解除→登場・属性・免疫の準備→新しい開始前B→楽曲の疲労処理→既存A/Cの開始前処理→Appeal計算。増本・石塚・山下葉留花の新Bを同じ段階に置く。山口が選ぶ最高疲労の対象は、この順序で変化した後の疲労を使う。",relatedCards:[21,34,45],status:"ユーザー回答で確定（実装済み）"},{code:"T04",category:"タイミング",title:"終了処理とB条件",summary:"終了時の疲労は通常疲労加算・BACKS回復後に判定する。",detail:"得点を確定し、位置疲労・BACKS回復・終了時の回復やチャージ等を処理してから通常B条件を判定する。通常条件は、同じ終了処理で新しく始まるBURSTの即時効果で変化する前の状態を両軍分判定する。反応型のBは、その後のBURST開始イベントで発動する。R7終了時はこの条件判定・新規BURSTを行わない。終了時予約効果と再判定の例外は個別補足に従う。",relatedCards:[],status:"既存ルール・回答済み内容の整理"},{code:"B01",category:"BURST",title:"通常BURST",summary:"条件達成後、同じ終了処理内で即BURST。発動保留はない。",detail:"通常BURSTは使用済みになると条件を満たしても再発動しない。再使用可能にする効果がある場合だけ再び使用できる。BURST開始時には、本人の疲労を0にし、BURST回数を1増やす。Bがないのではなく、固有Bと共通処理を分けて扱う。",relatedCards:[],status:"既存ルール・回答済み内容の整理"},{code:"B02",category:"BURST",title:"強制BURST",summary:"条件と通常使用済みを無視してBURSTし、Bも発動する。",detail:"通常BURSTの使用済み状態は消費せず、使用済みのメンバーも対象にできる。本人疲労0・BURST回数加算は行う。同じ連鎖内で発動済みのメンバーは抽選候補から除外し、再発動させない。複数対象は重複なしで選び、1人ずつ解決する。候補が指定人数未満なら残る候補だけ、0人なら対象への効果は不発。",relatedCards:[6,47,48],status:"既存ルール・回答済み内容の整理"},{code:"B03",category:"BURST",title:"BURST中・経験者・累計回数",summary:"BURST中、BURST経験者、累計BURST回数は別の値。",detail:"BURST中人数は今BURST状態の人数で、BACKSも含む。両軍なら最大16人。BURST経験者は試合中に通常または強制BURSTを1回以上開始したメンバー。累計BURST回数は通常・強制を全て足し、同じ人の複数回も数える。JOYFUL LOVEや使用済みリセットでは経験・累計回数を消さない。",relatedCards:[6,12,41,47,48],status:"既存ルール・回答済み内容の整理"},{code:"B04",category:"BURST",title:"通常BURSTを再使用可にする",summary:"使用済みだけを解除し、条件や履歴・累計回数は戻さない。",detail:"通常BURSTを再使用可能にしても、その場で自動的に条件を再判定するわけではない。次の通常条件判定に従う。例外として大沼は、次回終了時にリセットし、続く同じ終了処理の条件判定で再び通常BURSTできる。反復発動はこの既存の個性を維持する。",relatedCards:[12,16,41],status:"既存ルール・回答済み内容の整理"},{code:"B05",category:"BURST",title:"チャージ",summary:"BACKS終了で＋1、次の登場時に全消費する蓄積能力。",detail:"このキーワードを持つ3人はチャージ上限5。本人のAが有効なBACKS終了時に1増え、有効なAで次に登場したとき全消費する。消費数はその登場時に実際に使った数。B条件の消費3以上はその回の実消費数を参照する。Aが無効ならその消費・効果は行わない。竹内のAは追加でチャージを与え、消費能力がないメンバーも保持できるが、自動的に消費能力は得ない。",relatedCards:[32,38,43,44],status:"既存ルール・回答済み内容の整理"},{code:"B06",category:"BURST",title:"再充填",summary:"BACKSの味方と交換し、最後に消費した値へチャージを戻す。",detail:"ステージにいる場合は合法な味方BACKS1人を選び、自身と交換する。すでにBACKSなら交換しない。既存の固定で合法な交換先がなければ交換できない部分だけ行わない。その後チャージを最後の実消費値に設定する。今回未消費の強制BURSTでも最後の値を使う。単純加算ではなく、最後の消費値への復元。人間は交換先を選択する。",relatedCards:[32,38,44],status:"既存ルール・回答済み内容の整理"},{code:"N01",category:"数値",title:"Appealと基礎Appeal",summary:"「Appeal＋／−」は基礎値を変更しない。基礎値変更は別効果。",detail:"永続の基礎Appeal変更は試合終了まで残り、明記した増減は重複する。宮地の永続低下は最低0。上村Cによる基礎＋1はそのパフォーマンスだけで、永続値へ書き込まない。条件が「基礎Appeal」を参照するときは、その時点で有効な永続・一時補正込みの値を使う。",relatedCards:[24,27,33,37],status:"既存ルール・回答済み内容の整理"},{code:"N02",category:"数値",title:"疲労とペナルティ",summary:"疲労0〜2は0、3〜4は−1、5〜6は−2、7以上は−3。",detail:"疲労減少の最低値は0。疲労ペナルティなしの経験はAppeal計算時に判定し、通常は疲労0〜2。青春の馬などで数値減少が0になっても、疲労3以上でペナルティ対象なら「ペナルティなし」の経験には数えない。BURSTが起こる前の終了時疲労と、Appeal計算時の疲労を区別する。",relatedCards:[2,26,29,39],status:"既存ルール・回答済み内容の整理"},{code:"N03",category:"数値",title:"小坂の倍率・位置疲労軽減",summary:"位置ボーナスと位置疲労は、加算・軽減後に小坂Aで2倍。",detail:"小坂Aはスキルや楽曲による普通のAppeal加算を倍にしない。位置ボーナスへの補正と、位置由来疲労への軽減を反映した後、それぞれ2倍にする。疲労ペナルティも2倍。村井Cの位置疲労軽減は通常の位置疲労だけが対象で、相手B等の疲労付与や小坂Bの終了時＋5には適用しない。",relatedCards:[9,25,26],status:"既存ルール・回答済み内容の整理"},{code:"N04",category:"数値",title:"純減",summary:"減少合計から上昇合計を引いた、正味のAppeal減少。",detail:"守屋の新条件では、その回の対面へ実適用されたA/B/C/楽曲の数値減少と実際の疲労ペナルティを足し、同じ回のA/B/C/楽曲の数値上昇を引く。基礎Appealの増減、位置ボーナスの増減・無効化、疲労軽減そのものはこの式に含めない。盾や軽減で消えた分も含めない。例：減少5・上昇2なら純減3で成立、減少4・上昇2なら純減2で不成立。",relatedCards:[23],status:"既存ルール・回答済み内容の整理"},{code:"N05",category:"数値",title:"上昇・コピー・引継ぎの範囲",summary:"コピー元は対面Aの実上昇。B条件の上昇合計とは別。",detail:"藤吉Aは対面本人のAUTOによる、無効・軽減・大園の倍化等を反映した実際のプラスだけをコピーする。本人B条件の上昇合計はA/B/C/楽曲の実プラスで、基礎・位置・疲労軽減を除く。Bが引き継ぐのは本人Aの実上昇分だけ。守屋Bの引継ぎも本人Aの実下降分だけで、他人の減少や疲労を丸ごと引き継がない。コピー同士は再帰させず循環コピーを0とする。",relatedCards:[20,23],status:"既存ルール・回答済み内容の整理"},{code:"C01",category:"防御・競合",title:"マイナス無効",summary:"相手由来の効果全般と、楽曲由来の数値・属性等のマイナス効果を防ぐ。",detail:"旧マイナス無効と旧相手効果無効で、どちらかが防いだ効果を防ぐ 生",tags:["3期生","櫻坂46","対スキル","対センター"],themeTags:["対スキル","対センター"],base:5,A:"対面の相手メンバーのAUTOを無効にする。",Bcond:"自身がFRONT-LまたはFRONT-Rにいる状態で、相手メンバーがBURSTを開始したとき。R1でも成立する。",B:"相手メンバー1人を選び、次のパフォーマンス終了まで現在のポジションに固定する。",C:"相手CENTERのCENTER SKILLを無効にし、自身の疲労値を+2する。",skill:"matono"},{id:8,no:"No.08",name:"向井純葉",attr:"クール",group:"櫻坂46",generation:"3期生",tags:["3期生","櫻坂46","Appeal上昇","勝ちポイント"],themeTags:["Appeal上昇","勝ちポイント"],base:4,A:"ラウンド開始時点で自チームがポイントで勝っているなら、自身のAppealを+2する。",Bcond:"自チームが勝利したパフォーマンスに自身がステージで参加した回数が、試合中累計2回に達する。判定時も自身がステージにいる。",B:"次のパフォーマンス中、自身のAppealを自チームの現在ポイント数だけプラスする（最大+3）。",C:null,skill:"mukai"},{id:9,no:"No.09",name:"村井優",attr:"ユーモア",group:"櫻坂46",generation:"3期生",tags:["3期生","櫻坂46","フォーメーション移動","Appeal上昇"],themeTags:["フォーメーション移動","Appeal上昇"],base:4,A:"そのラウンドに自身がBACKSからステージへ移動した場合、そのパフォーマンス中、自身にマイナス無効を適用する。R1の初期配置は移動に数えない。",Bcond:"同一ラウンドに自チームの3人以上がBACKSからステージへ移動する。R1の初期配置は数えない。",B:"次のパフォーマンス中、味方ステージ5人全員のAppealを+1し、全員にマイナス無効を適用する。本人の再登場・出場は要求しない。",C:"そのラウンドにBACKSからステージへ移動した味方メンバーのAppealを+1し、そのパフォーマンスの位置由来疲労増加を1軽減する（最低0）。R1の初期配置は移動に数えない。",skill:"murai"},{id:10,no:"No.10",name:"村山美羽",attr:"クール",group:"櫻坂46",generation:"3期生",tags:["3期生","櫻坂46","クール","単一属性"],themeTags:["クール","単一属性"],base:4,A:"自チームのステージにクールが3人以上なら、自身のAppealを+2する。",Bcond:"クール楽曲でBACKSとしてパフォーマンス終了。",B:"次のパフォーマンス中、自チームのクールメンバーのAppealを+1する。",C:null,skill:"murayama"},{id:11,no:"No.11",name:"山下瞳月",attr:"クール",group:"櫻坂46",generation:"3期生",tags:["3期生","櫻坂46","センター","クール"],themeTags:["センター","クール"],base:2,A:"クール楽曲で自身がCENTERなら、自身のAppealを+1する。",Bcond:"CENTERで累計2パフォーマンスを終了する。",B:"BURST中、自身のAppealを+2し、自身にマイナス無効を適用する。",C:"CENTERなら自身のAppealを+5する。このCENTER SKILLは楽曲によるCENTER SKILL無効化を受けない。",skill:"yamashita"},{id:12,no:"No.12",name:"松田里奈",attr:"ユーモア",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","バースト","Appeal上昇"],themeTags:["バースト","Appeal上昇"],base:3,A:"自チームの累計BURST回数（通常BURST・強制BURSTを含む）が5回以上なら、自身のAppealを+3する。",Bcond:"同じパフォーマンス終了処理内で、自身以外の味方2人以上がBURSTを開始する。",B:"次のパフォーマンス終了後、味方1人をランダムに選び、そのメンバーの通常BURST使用済み状態をリセットする。累計BURST回数は減らさない。",C:"BURST中の味方メンバーのAppealを+2する。",skill:"matsuda"},{id:13,no:"No.13",name:"井上梨名",attr:"ユーモア",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","疲労回復","総疲労値"],themeTags:["疲労回復","総疲労値"],base:3,A:"シンメの疲労値を-2する。自身がBACKSにいる場合は、シンメへの効果の代わりに味方CENTERの疲労値を-2する（最低0）。",Bcond:"パフォーマンス終了時、自チーム8人のうち疲労値5以上のメンバーが2人以上いる。自身の位置・BACKS経験回数は問わない。",B:"自チーム8人全員の疲労値を-2する（最低0）。",C:null,skill:"inoue"},{id:14,no:"No.14",name:"遠藤光莉",attr:"クール",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","クール","楽曲"],themeTags:["クール","楽曲"],base:3,A:"シンメがクールなら、自身とシンメのAppealをそれぞれ+1する。",Bcond:"パフォーマンス終了時、CENTER・FRONT-L・FRONT-Rの3人全員がクール。",B:"次のパフォーマンスの楽曲を「ジャマイカビール」に変更する。",C:null,skill:"endo_hikari"},{id:15,no:"No.15",name:"大園玲",attr:"クール",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","対スキル","Appeal増減"],themeTags:["対スキル","Appeal増減"],base:4,A:"自身はスキルおよび楽曲によるAppealの増減を受けない。",Bcond:"R5以降に、自身がFRONTまたはCENTERでパフォーマンスを終了する。",B:"BURST中、自身のAUTOによるAppeal増減無効を解除し、スキル・楽曲由来のAppeal上昇量を2倍にする。スキル・楽曲由来のAppeal減少は受けない。",C:null,skill:"ozono"},{id:16,no:"No.16",name:"大沼昌保",attr:"ユーモア",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","疲労付与","バースト"],themeTags:["疲労付与","バースト"],base:3,A:"対面の疲労値を+2する。",Bcond:"パフォーマンス終了時、対面の疲労値が7以上。",B:"BURST中、自身のAppealを+5する。BURSTしたパフォーマンス終了後、自身の基礎Appealを永続的に-1する（最低0）。その後、自身の通常BURST使用済み状態をリセットする。続くBURST条件判定で条件を満たした場合は、同じ終了処理内で再び通常BURSTする。",C:null,skill:"onuma"},{id:17,no:"No.17",name:"幸坂茉里乃",attr:"キュート",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","フォーメーション固定","Appeal低下"],themeTags:["フォーメーション固定","Appeal低下"],base:2,A:"自身がBACKSにいる間、相手CENTERのAppealを-2する。",Bcond:"キュート楽曲でステージ5枠のいずれかに配置され、パフォーマンスを終了する。",B:"相手メンバー1人を選び、次のパフォーマンス終了までFRONT-Rに固定し、そのメンバーのAppealを-6する。",C:null,skill:"kousaka"},{id:18,no:"No.18",name:"武元唯衣",attr:"クール",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","クール","楽曲"],themeTags:["クール","楽曲"],base:3,A:"楽曲属性がクールなら、自身のAppealを+3する。",Bcond:"自身がステージでクール楽曲のパフォーマンスを試合中累計2回終了する。判定時もステージにいる。",B:"次のパフォーマンスの楽曲属性をクールとして扱い、自身のAppealを+2する。",C:null,skill:"takemoto"},{id:19,no:"No.19",name:"田村保乃",attr:"キュート",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","対バースト","Appeal低下"],themeTags:["対バースト","Appeal低下"],base:4,A:"対面がBURST中なら、その対面のAppealを-4する。",Bcond:"自身がステージにいる状態で、相手メンバーがBACKSからBURSTを開始したとき。",B:"同じパフォーマンス終了処理内でBACKSからBURSTした相手が複数いる場合も1回だけ発動し、その中からランダムに1人を選ぶ。選ばれた相手を次のパフォーマンス終了までCENTERに固定し、Bスキルを無効にする。元のCENTERメンバーはBACKSへ移動する。",C:"BURST中の相手メンバーのAppealを-2する。",skill:"tamura"},{id:20,no:"No.20",name:"藤吉夏鈴",attr:"クール",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","対スキル","Appeal上昇"],themeTags:["対スキル","Appeal上昇"],base:4,A:"対面の相手AUTOによるAppeal上昇値と同じ値だけ、自身のAppealも上昇する。",Bcond:"パフォーマンス終了時、そのパフォーマンス中に自身へ実適用されたAUTO・BURST・CENTER SKILL・楽曲によるAppeal上昇量の合計が4以上。位置ボーナス・基礎Appealは含めない。",B:"そのパフォーマンス中に自身へ実適用された自身のAUTOによるAppeal上昇分を、次のパフォーマンスにも引き継ぐ。",C:"自チームのクールメンバーは、相手AUTOによるAppeal減少を受けない。",skill:"fujiyoshi"},{id:21,no:"No.21",name:"増本綺良",attr:"ユーモア",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","ユーモア","疲労付与"],themeTags:["ユーモア","疲労付与"],base:3,A:"両チームのユーモアではないメンバーの疲労値を+1する。",Bcond:"自身がステージでパフォーマンスを終了し、その時点の相手8人の総疲労値が24以上。",B:"次のパフォーマンス開始前、双方の配置確定後に、その時点の自身の対面メンバーの疲労値を+8する。その時点で自身がBACKSなら対象がなく不発。",C:null,skill:"masumoto"},{id:22,no:"No.22",name:"森田ひかる",attr:"キュート",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","多属性","Appeal低下"],themeTags:["多属性","Appeal低下"],base:5,A:"自チームのステージにクールとユーモアが1人以上ずついるなら、対面のAppealを-1する。",Bcond:"自身がCENTERでパフォーマンスを終了し、自チームのFRONT-LとFRONT-Rがクールとユーモアを1人ずつ担当できる。左右は問わない。自身をCENTERへ移動・固定する効果ではない。",B:"次のパフォーマンス中、自身を本来のキュートに加えてクール・ユーモアとしても扱い、対面のAppealを-2する。",C:"相手CENTERのAppealを、自チームのステージに存在する属性種類数だけマイナスする。",skill:"morita"},{id:23,no:"No.23",name:"守屋麗奈",attr:"キュート",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","疲労付与","Appeal低下"],themeTags:["疲労付与","Appeal低下"],base:4,A:"対面の疲労値が3以上なら、その対面のAppealを-2する。",Bcond:"パフォーマンス終了時、そのパフォーマンスの対面に実適用された、位置ボーナス以外のAppeal減少合計からAppeal上昇合計を差し引いた純減が3以上。減少には疲労ペナルティを含み、基礎Appeal・位置ボーナスの増減は含めない。",B:"そのパフォーマンス中に対面へ実適用された自身のAUTOによるAppeal下降分を、次のパフォーマンスにも引き継ぐ。さらにBURST開始時の対面1人を、現在の位置に次のパフォーマンス終了まで固定する。",C:"疲労値が3以上の相手メンバーのAppealを-1する。",skill:"moriya"},{id:24,no:"No.24",name:"山崎天",attr:"クール",group:"櫻坂46",generation:"2期生",tags:["2期生","櫻坂46","負けポイント","Appeal上昇"],themeTags:["負けポイント","Appeal上昇"],base:3,A:"ラウンド開始時点で自チームがポイントで負けている場合のみ、相手チームの現在ポイント数だけ自身のAppealをプラスする。",Bcond:"自チームが2パフォーマンス連続で敗北する。引き分けは連敗に含めず、連敗数をリセットする。",B:"自身の基礎Appealを永続的に+2する。複数回発動した場合は重複する。",C:"自身がCENTERで自チームが敗北したとき、その時点でステージにいる味方の疲労値を-1し、その味方は次のパフォーマンスのみAppeal+1。引き分けでは発動しない。",skill:"yamasaki"},{id:25,no:"No.25",name:"金村美玖",attr:"クール",group:"日向坂46",generation:"2期生",tags:["2期生","日向坂46","フォーメーション固定","Appeal上昇"],themeTags:["フォーメーション固定","Appeal上昇"],base:4,A:"前ラウンドと同じポジションでパフォーマンスする場合、そのポジションを連続で維持した回数だけ自身のAppealを+1する。R1は発動しない。",Bcond:"同一のステージ枠で累計4回パフォーマンスを終了する。判定時もその枠にいる。BACKSはカウントしない。",B:"BURST中、自チームのポジションボーナスを2倍にする。",C:"前ラウンドと同じポジションにいる味方メンバーのAppealを+1する。R1は発動しない。",skill:"kanemura"},{id:26,no:"No.26",name:"小坂菜緒",attr:"クール",group:"日向坂46",generation:"2期生",tags:["2期生","日向坂46","センター","フォーメーション固定"],themeTags:["センター","フォーメーション固定"],base:5,A:"自身が受けるポジション由来のAppealボーナスとポジション由来の疲労増加を、各種加算・軽減を反映した後に2倍する。自身の疲労ペナルティによるAppeal減少量も2倍する。",Bcond:"CENTERかつ自身の疲労値が8以上でパフォーマンス終了。",B:"BURST中、自身のAppealを+4する。BURSTしたパフォーマンス終了後、自身の疲労値を+5する。",C:"自身の疲労値が0～2なら、自チームのポジションボーナスをそれぞれ+1する。",skill:"kosaka"},{id:27,no:"No.27",name:"髙橋未来虹",attr:"クール",group:"日向坂46",generation:"3期生",tags:["3期生","日向坂46","クール","単一属性"],themeTags:["クール","単一属性"],base:4,A:"自チームのステージにクールが3人以上なら、自身のAppealを+2する。",Bcond:"自身がステージにおり、クール楽曲かつ味方CENTERがクールの状態でパフォーマンス終了。",B:"自身の基礎Appealを永続的に+1する。",C:null,skill:"takahashi"},{id:28,no:"No.28",name:"小西夏菜実",attr:"クール",group:"日向坂46",generation:"4期生",tags:["4期生","日向坂46","クール","フォーメーション移動"],themeTags:["クール","フォーメーション移動"],base:4,A:"シンメがクールなら、自身とシンメのAppealをそれぞれ+1する。",Bcond:"自身が累計で異なる3人とシンメになってパフォーマンスを終了する。",B:"次のパフォーマンス中、自身とその時点のシンメのAppealをそれぞれ+2する。",C:null,skill:"konishi"},{id:29,no:"No.29",name:"正源司陽子",attr:"クール",group:"日向坂46",generation:"4期生",tags:["4期生","日向坂46","対疲労付与","Appeal上昇"],themeTags:["対疲労付与","Appeal上昇"],base:4,A:"自身が疲労ペナルティを受けているなら、自身のAppealを+2する。",Bcond:"自身が疲労ペナルティを3パフォーマンス連続で受ける。",B:"BURST中、自身のAppealを+3する。",C:"疲労ペナルティを受けている味方メンバーのAppealを+1する。",skill:"shogenji"},{id:30,no:"No.30",name:"平岡海月",attr:"クール",group:"日向坂46",generation:"4期生",tags:["4期生","日向坂46","楽曲","多属性"],themeTags:["楽曲","多属性"],base:3,A:"その試合で登場済みの楽曲属性の種類数だけ自身のAppealを+1する（最大+3）。",Bcond:"自身がステージでクール・キュート・ユーモアの3属性の楽曲を各1回以上終了する。",B:"次のパフォーマンス中、自身のAppealを+5する。",C:null,skill:"hiraoka"},{id:31,no:"No.31",name:"宮田愛萌",attr:"クール",group:"日向坂46",generation:"2期生",tags:["2期生","日向坂46","疲労回復","総疲労値"],themeTags:["疲労回復","総疲労値"],base:4,A:"自チーム8人の総疲労値が10以下なら、自身のAppealを+2する。",Bcond:"R3以降のパフォーマンス終了時、自チーム8人の総疲労値が15以下。",B:"次のパフォーマンス中、自チームのステージ5人のAppealを+1する。",C:null,skill:"miyata"},{id:32,no:"No.32",name:"渡邉美穂",attr:"クール",group:"日向坂46",generation:"2期生",tags:["2期生","日向坂46","チャージ","フォーメーション固定"],themeTags:["チャージ","フォーメーション固定"],base:2,A:"BACKSでラウンド終了するたび自身のチャージを+1する（最大5）。次にステージ入りしたパフォーマンスでは、ステージ入り時点のチャージ数だけ自身のAppealをプラスし、そのチャージを0にする。",Bcond:"チャージ3以上の状態からステージ入りする。",B:"BURST解決時、自身がステージにいる場合、味方BACKS1人と位置を入れ替える。その後、最後に実消費した自身のチャージを、消費直前の値まで回復する。このパフォーマンスで未消費の場合も、最後に消費した値まで回復する。",C:null,skill:"watanabe_miho"},{id:33,no:"No.33",name:"上村ひなの",attr:"キュート",group:"日向坂46",generation:"3期生",tags:["3期生","日向坂46","基礎値","Appeal低下"],themeTags:["基礎値","Appeal低下"],base:3,A:"対面の有効な基礎Appealが4以上なら、その対面のAppealを-3する。",Bcond:"自身のAUTOで1以上のAppeal減少を実適用したパフォーマンスが、試合中累計3回以上。位置は問わず、同一パフォーマンスで複数人へ適用しても1回として数える。",B:"次のパフォーマンス中、自身のAUTOを対面1人ではなく相手ステージ全員に適用する。",C:"自身がCENTERにいるパフォーマンス中のみ、相手メンバー全員の基礎Appealを一時的に+1した後、Appealを-1する。CENTERを外れたら基礎Appealは元に戻る。",skill:"kamimura"},{id:34,no:"No.34",name:"石塚瑶季",attr:"キュート",group:"日向坂46",generation:"4期生",tags:["4期生","日向坂46","疲労付与","フォーメーション固定"],themeTags:["疲労付与","フォーメーション固定"],base:4,A:"自身がFRONTなら、Appeal計算前に対面の疲労値を+2する。",Bcond:"自身が同じFRONT枠で3パフォーマンス連続で終了する。",B:"次のパフォーマンス中、相手FRONT-LとFRONT-Rのポジションボーナスを0にする。さらにそのパフォーマンス開始前、双方の配置確定後に相手FRONT-LとFRONT-Rの疲労値をそれぞれ+2する。",C:null,skill:"ishizuka"},{id:35,no:"No.35",name:"清水理央",attr:"キュート",group:"日向坂46",generation:"4期生",tags:["4期生","日向坂46","多属性","対スキル"] 下"],base:5,A:"対面が相手ステージの単独最多属性に属し、その単独最多属性の人数が3人以上なら、対面のAppealを-2する。",Bcond:"自身が出場してパフォーマンスを終了し、相手ステージの単独最多属性の人数が4人以上。単独最多属性がなければ成立しない。",B:"次のパフォーマンス中、その属性を持つ相手メンバー全員のAppealを-1する。",C:"自身がCENTERで、相手ステージの単独最多属性が3人以上かつ相手CENTERもその属性なら、その単独最多属性の人数と同じ値だけ相手CENTERのAppealをマイナスする。",skill:"kawata"},{id:41,no:"No.41",name:"森本茉莉",attr:"ユーモア",group:"日向坂46",generation:"3期生",tags:["3期生","日向坂46","多属性","バースト"],themeTags:["多属性","バースト"],base:5,A:"各ラウンド開始時、本来のユーモアに加えてクールまたはキュートのどちらか1属性をランダムで追加する。そのラウンド中のみ有効。",Bcond:"追加された属性と現在の楽曲属性が一致した状態でパフォーマンス終了。",B:"自身のAppealを+2し、自身の通常BURST使用済み状態をリセットする。累計BURST回数は減らさない。",C:null,skill:"morimoto"},{id:42,no:"No.42",name:"山口陽世",attr:"ユーモア",group:"日向坂46",generation:"3期生",tags:["3期生","日向坂46","疲労回復","疲労付与"],themeTags:["疲労回復","疲労付与"],base:4,A:"パフォーマンス開始前、自チームで疲労値が最も高いメンバー1人の疲労値を-1し、相手チームで疲労値が最も高いメンバー1人の疲労値を+1する。対象が複数いる場合はランダムに1人を選ぶ。",Bcond:"自身がステージでパフォーマンスを終了し、その時点の自チームメンバーの最高疲労値が7以上。",B:"BURST中は、自身のAUTOによる疲労値の減少量・増加量をそれぞれ1から3に変更する。",C:"自身がCENTERにいるパフォーマンス開始前、相手BACKS3人全員の疲労値を+3する。",skill:"yamaguchi"},{id:43,no:"No.43",name:"竹内希来里",attr:"ユーモア",group:"日向坂46",generation:"4期生",tags:["4期生","日向坂46","チャージ","フォーメーション固定"],themeTags:["チャージ","フォーメーション固定"],base:3,A:"ラウンド終了時、BACKSにいる味方メンバーそれぞれのチャージを+1する。",Bcond:"同じ3人をBACKSに配置した状態で、2パフォーマンス連続で終了する。",B:"BURST中、自身のAppealを+3する。",C:null,skill:"takeuchi"},{id:44,no:"No.44",name:"平尾帆夏",attr:"ユーモア",group:"日向坂46",generation:"4期生",tags:["4期生","日向坂46","チャージ","フォーメーション固定"],themeTags:["チャージ","フォーメーション固定"],base:3,A:"BACKSでラウンド終了するたび自身のチャージを+1する（最大5）。次にステージ入りするパフォーマンスの開始前、味方8人の最高疲労の1人の疲労値を消費チャージ数だけ減らし、相手8人の最高疲労の1人の疲労値を同じ数だけ増やす。同率はそれぞれランダムに選ぶ。そのチャージを0にする。",Bcond:"チャージ3以上の状態からステージ入りする。",B:"BURST解決時、自身がステージにいる場合、味方BACKS1人と位置を入れ替える。その後、最後に実消費した自身のチャージを、消費直前の値まで回復する。このパフォーマンスで未消費の場合も、最後に消費した値まで回復する。",C:null,skill:"hirao"},{id:45,no:"No.45",name:"山下葉留花",attr:"ユーモア",group:"日向坂46",generation:"4期生",tags:["4期生","日向坂46","フォーメーション移動","疲労付与"],themeTags:["フォーメーション移動","疲労付与"],base:2,A:"その試合で自身がパフォーマンスを経験したポジション種別（CENTER・FRONT・MIDDLE・BACKS）の種類数だけ、自身
