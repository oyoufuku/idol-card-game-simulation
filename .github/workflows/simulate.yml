name: Targeted RANDOM card WAR
run-name: RANDOM 8 cards / 300 paired per card across seeds 1 and 2
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: targeted-random-pr42-${{ github.ref }}
  cancel-in-progress: false
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 1
            source_run: '39030416736'
          - seed: 2
            source_run: '39065015140'
    env:
      TARGETED_SEED: ${{ matrix.seed }}
      SOURCE_RUN_ID: ${{ matrix.source_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 8dfcd7532ddc747e504e70d72d15e74edb7dd410
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: '11.19.0'
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: Restore the completed RANDOM L2 campaign
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ matrix.source_run }}
          github-token: ${{ github.token }}
          pattern: simulation-results-level2-*
          path: simulation-results/restored
      - name: Validate source, reuse 400 paired jobs, run 800 additional comparisons
        run: |
          node --import tsx --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {copyFileSync,existsSync,mkdirSync,readFileSync,writeFileSync,appendFileSync} from 'node:fs';
          import {resolve,join} from 'node:path';
          import {availableParallelism} from 'node:os';
          import {execFileSync} from 'node:child_process';
          import {parseInputs,contract,restoredArtifactRoot,validateResume,fileHashes} from './scripts/actions-simulation.ts';
          import {warScope} from './src/simulation/war-scope.ts';
          import {buildWarPlan,hash} from './src/simulation/war-plan.ts';
          import {executeWarPlan} from './src/simulation/war-runner.ts';
          import {writeWarOutput} from './src/simulation/war-output.ts';

          const measuredSha='8dfcd7532ddc747e504e70d72d15e74edb7dd410';
          const ids=[10,11,14,25,26,34,36,38];
          const seed=Number(process.env.TARGETED_SEED);
          const sourceRun=process.env.SOURCE_RUN_ID;
          assert([1,2].includes(seed));
          assert.equal(sourceRun,seed===1?'39030416736':'39065015140');
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),measuredSha);
          const context={sha:measuredSha,repository:process.env.GITHUB_REPOSITORY||'oyoufuku/idol-card-game-simulation',runId:process.env.GITHUB_RUN_ID||'0',attempt:process.env.GITHUB_RUN_ATTEMPT||'1'};
          const config=parseInputs({scenario:'CUSTOM',mode:'all',archetype_selection:'constructed',cpu_strategy:'charge-archetype',matches_per_matchup:50,random_matches:1000,seed,fast_simulation:true,burst_round_trace:true,cpu_search:'two-stage',preview_candidates:'100'});
          const expected=contract(config,context);
          const source=restoredArtifactRoot(resolve(process.env.SOURCE_DIR||'simulation-results/restored'),sourceRun);
          const prior=validateResume(source,expected,context,sourceRun);
          const oldSummary=JSON.parse(readFileSync(join(source,'summary.json'),'utf8'));
          assert(oldSummary.random.complete&&oldSummary.archetype.complete);
          assert(oldSummary.warRuns.some(r=>r.output==='war/level2-random'&&r.complete));
          const original=[];
          for(const mode of ['random','archetype']){
            const checkpoint=readFileSync(join(source,mode+'-checkpoint.jsonl'),'utf8').trim().split('\n').map(line=>JSON.parse(line)).sort((a,b)=>a.index-b.index);
            checkpoint.forEach((row,index)=>assert.equal(row.index,index));
            assert.equal(checkpoint.length,mode==='random'?1000:3900);
            original.push(...checkpoint.map(row=>row.result));
          }
          const baselines=warScope(original,true);
          assert.equal(baselines.length,3250);
          const sourceWar=join(source,'war/level2-random');
          const oldPlan=JSON.parse(readFileSync(join(sourceWar,'plan.json'),'utf8'));
          assert.equal(oldPlan.baselineHash,hash(baselines));
          assert.equal(oldPlan.options.samplesPerCard,50);
          assert.equal(oldPlan.options.seed,seed);
          assert.deepEqual(oldPlan.options.modes,['random']);
          const options={...oldPlan.options,samplesPerCard:150,cardIds:ids,detailIds:[],ablations:[],pairs:[],topPairs:0};
          const plan=buildWarPlan(baselines,options,oldPlan.matchOptions);
          assert.equal(plan.jobs.length,1200);
          assert.equal(plan.trials.length,1200);
          assert.equal(plan.pairs.length,0);
          for(const id of ids)assert.equal(plan.trials.filter(t=>t.cardId===id).length,150);
          assert(plan.trials.every(t=>t.mode==='random'&&t.kind==='card'&&t.job));
          assert(plan.jobs.every(j=>!j.options.skillAblations?.length));
          const oldJobs=new Map(readFileSync(join(sourceWar,'checkpoint.jsonl'),'utf8').trim().split('\n').map(line=>{const row=JSON.parse(line);assert.equal(row.planHash,hash(oldPlan));assert.equal(row.resultHash,hash(row.result));return [row.key,row];}));
          assert.equal(oldJobs.size,2400);
          const oldTrials=oldPlan.trials.filter(t=>ids.includes(t.cardId));
          assert.equal(oldTrials.length,400);
          for(const t of oldTrials)assert(plan.trials.some(n=>n.cardId===t.cardId&&n.side===t.side&&n.baseline===t.baseline&&n.job===t.job));
          const reused=plan.jobs.filter(j=>oldJobs.has(j.key)).length;
          assert.equal(reused,400);
          const output=resolve(process.env.OUTPUT_DIR||'simulation-results/targeted');
          assert(!existsSync(output));mkdirSync(output,{recursive:true});
          const audit={schemaVersion:1,kind:'targeted-random-cwar-extension',runId:context.runId,sourceRunId:sourceRun,seed,measuredCommit:measuredSha,workflowCommit:process.env.GITHUB_WORKFLOW_SHA||process.env.GITHUB_SHA||null,inputFingerprint:plan.fingerprint,sourceContract:prior.contract,sourceArtifactVerified:true,cardIds:ids,samplesPerCard:150,previousSamplesPerCard:50,reusedJobs:reused,plannedJobs:1200,plannedNewJobs:800,independentCampaignSeeds:[1,2],pooledTargetPerCard:300,noBaselineGames:true,noArchetypeWar:true,noSkillAblation:true,noLevel3:true,startedAt:new Date().toISOString()};
          writeFileSync(join(output,'targeted-request.json'),JSON.stringify(audit,null,2)+'\n');
          console.log(JSON.stringify(audit));
          let stopped=false;
          const stop=()=>{stopped=true;console.log('Stopping after active paired games; saving checkpoint.');};
          process.on('SIGINT',stop);process.on('SIGTERM',stop);
          const timer=setTimeout(stop,300*60*1000);
          const log=join(output,'progress.log');
          let results;
          try{
            results=await executeWarPlan(plan,join(output,'war/targeted-random-150'),{workers:Math.min(availableParallelism(),4),resume:false,maxNewJobs:process.env.TARGETED_DRY_RUN==='true'?0:800,stopped:()=>stopped,reusePaths:[sourceWar],progress:(done,total)=>{const s=`[targeted-random seed=${seed}] ${done}/${total}`;console.log(s);appendFileSync(log,s+'\n');}});
          }finally{clearTimeout(timer);process.off('SIGINT',stop);process.off('SIGTERM',stop);}
          const warOut=join(output,'war/targeted-random-150');
          const run=writeWarOutput(warOut,plan,baselines,results);
          const data=JSON.parse(readFileSync(join(warOut,'statistics.json'),'utf8'));
          const cards=data.random_card_war_stats.filter(r=>ids.includes(r.cardId));
          assert.equal(cards.length,8);
          if(process.env.TARGETED_DRY_RUN==='true')assert.equal(results.size,400);
          else if(run.complete)assert(cards.every(r=>r.pairedSamples===150&&r.pendingSamples===0));
          const status={...audit,completedJobs:results.size,newJobs:results.size-reused,complete:run.complete,finishedAt:new Date().toISOString(),warRun:run};
          writeFileSync(join(output,'summary.json'),JSON.stringify(status,null,2)+'\n');
          writeFileSync(join(output,'analysis_bundle.json'),JSON.stringify({schemaVersion:1,summary:status,random_card_war_stats:cards,randomCardWAR:cards,card_war_stats:[],archetypeCardWAR:[],card_skill_ablation_stats:[],card_war_mode_comparison:[],notes:['RANDOM only. Baseline/CPU/search/game definitions are unchanged.','150 includes the original 50 paired samples; do not add the old 50 again.','Two seed campaigns pool to 300 paired samples per target, clustered by original match.','Original baselines and source metadata are retained for reproducible paired comparisons.']},null,2)+'\n');
          for(const file of ['random-checkpoint.jsonl','archetype-checkpoint.jsonl','catalog-snapshot.json'])copyFileSync(join(source,file),join(output,file));
          writeFileSync(join(output,'source-manifest.json'),JSON.stringify(prior,null,2)+'\n');
          writeFileSync(join(output,'targeted-manifest.json'),JSON.stringify({schemaVersion:1,summary:status,files:fileHashes(output)},null,2)+'\n');
          if(process.env.GITHUB_STEP_SUMMARY)appendFileSync(process.env.GITHUB_STEP_SUMMARY,`\nSeed ${seed}: ${results.size}/1200 jobs complete; ${reused} reused, ${results.size-reused} new. 8 cards ×150 paired per seed; pooled goal 300 per card. Source ${sourceRun}, game ${measuredSha}. No baseline games or L3.\n`);
          console.log(JSON.stringify(status));
          if(!run.complete&&process.env.TARGETED_DRY_RUN!=='true')process.exitCode=1;
          JS
      - name: Save targeted results and incomplete checkpoints
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: targeted-random-pr42-seed${{ matrix.seed }}-150paired-${{ github.run_id }}-${{ github.run_attempt }}
          path: simulation-results/targeted/
          if-no-files-found: error
          retention-days: 14
