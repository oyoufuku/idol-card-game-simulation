name: Constructed decks and RANDOM through L1
run-name: Decks + RANDOM + L1 / seed ${{ inputs.seed }}
on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Previous parallel run ID; same commit and settings required
        type: string
        default: ""
      seed:
        type: number
        default: 1
      matches_per_matchup:
        description: Games per constructed matchup INCLUDING mirrors
        type: number
        default: 50
      random_matches:
        type: number
        default: 1000
      runtime_minutes:
        type: number
        default: 300
      retention_days:
        type: number
        default: 7
permissions:
  contents: read
  actions: write
concurrency:
  group: parallel-l1-${{ github.ref }}-${{ inputs.seed }}
  cancel-in-progress: false
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        mode: [random, archetype]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: '11.19.0'
          cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: inputs.resume_run_id != ''
        with:
          pattern: parallel-baseline-*
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: simulation-results/restored
      - name: Run one baseline on its own runner
        env:
          PARALLEL_INPUTS: ${{ toJSON(inputs) }}
          PART_MODE: ${{ matrix.mode }}
        run: node --import tsx scripts/actions-parallel.ts "$PART_MODE" simulation-results/part
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: parallel-baseline-${{ matrix.mode }}
          overwrite: true
          path: simulation-results/part/
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
  aggregate:
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: '11.19.0'
          cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: parallel-baseline-*
          path: simulation-results/parts
      - name: Validate and aggregate without playing new games
        env:
          PARALLEL_INPUTS: ${{ toJSON(inputs) }}
        run: node --import tsx scripts/actions-parallel.ts aggregate simulation-results/remote
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: simulation-results-parallel-${{ github.run_id }}-${{ github.run_attempt }}
          path: simulation-results/remote/
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
  level1:
    needs: aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: '11.19.0'
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: Prepare L1 with the same baseline contract and no L2 continuation
        id: prepare
        env:
          PARALLEL_INPUTS: ${{ toJSON(inputs) }}
        run: |
          node --import tsx --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          import {parallelInputs} from './scripts/actions-parallel.ts';
          const raw = parallelInputs(JSON.parse(process.env.PARALLEL_INPUTS));
          const inputs = {...raw, analysis_level:'level1', resume_run_id:process.env.GITHUB_RUN_ID, continue_to_level2:false};
          appendFileSync(process.env.GITHUB_ENV, 'SIMULATION_INPUTS='+JSON.stringify(inputs)+'\n');
          JS
          export SIMULATION_INPUTS="$(node --import tsx --input-type=module -e 'import {parallelInputs} from "./scripts/actions-parallel.ts"; process.stdout.write(JSON.stringify({...parallelInputs(JSON.parse(process.env.PARALLEL_INPUTS)),analysis_level:"level1",resume_run_id:process.env.GITHUB_RUN_ID,continue_to_level2:false}));')"
          node --import tsx scripts/actions-simulation.ts prepare
      - name: Restore validated combined baseline
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: simulation-results-parallel-${{ github.run_id }}-${{ github.run_attempt }}
          path: simulation-results/restored
      - name: Run L1 only
        run: node --import tsx scripts/actions-simulation.ts run
      - name: Save L1 results including incomplete checkpoints
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: simulation-results/remote/
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
